<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rennrad Routenplaner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    #root { display: flex; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

    /* ── Sidebar ── */
    .sidebar { width: 340px; min-width: 340px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; overflow-y: auto; height: 100vh; position: sticky; top: 0; }
    .sidebar-header { padding: 20px 20px 14px; border-bottom: 1px solid #334155; background: linear-gradient(135deg,#1e293b,#0f172a); }
    .app-title { font-size: 19px; font-weight: 700; color: #f8fafc; display: flex; align-items: center; gap: 10px; }
    .app-subtitle { font-size: 11px; color: #64748b; margin-top: 3px; }
    .sidebar-section { padding: 14px 16px; border-bottom: 1px solid #2d3f55; }
    .section-title { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
    .form-group { margin-bottom: 10px; }
    label { font-size: 13px; color: #94a3b8; margin-bottom: 4px; display: block; }
    input[type="text"] { width: 100%; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 8px 11px; border-radius: 8px; font-size: 13px; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #3b82f6; }
    input[type="range"] { width: 100%; cursor: pointer; accent-color: #3b82f6; margin-top: 4px; }
    .range-display { display: flex; justify-content: space-between; align-items: baseline; margin-top: 3px; }
    .range-value { font-size: 20px; font-weight: 700; color: #3b82f6; }
    .range-unit { font-size: 12px; color: #64748b; }

    /* ── Mode tabs in sidebar ── */
    .mode-tabs { display: flex; gap: 2px; padding: 4px; background: #0f172a; border-radius: 10px; border: 1px solid #334155; margin-bottom: 0; }
    .mode-tab { flex: 1; padding: 7px 10px; background: transparent; border: none; color: #64748b; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 7px; transition: all 0.2s; text-align: center; }
    .mode-tab.active { background: #3b82f6; color: white; }

    /* ── Manual waypoint list in sidebar ── */
    .mwp-list { }
    .mwp-empty { font-size: 12px; color: #475569; padding: 8px 0 12px; line-height: 1.5; }
    .mwp-row { display: flex; align-items: center; gap: 7px; padding: 6px 0; border-bottom: 1px solid #1e293b; }
    .mwp-badge { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; background: #6366f1; color: #fff; }
    .mwp-badge.first { background: rgba(34,197,94,0.25); font-size: 13px; }
    .mwp-badge.last  { background: rgba(239,68,68,0.25); font-size: 13px; }
    .mwp-name { flex: 1; font-size: 12px; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .mwp-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .mwp-btn { background: none; border: 1px solid #334155; color: #64748b; border-radius: 4px; width: 20px; height: 20px; cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; padding: 0; }
    .mwp-btn:hover:not(:disabled) { background: #334155; color: #f8fafc; }
    .mwp-btn:disabled { opacity: 0.2; cursor: default; }
    .mwp-btn.del { border-color: rgba(239,68,68,0.3); color: #f87171; background: rgba(239,68,68,0.07); }
    .mwp-btn.del:hover { background: rgba(239,68,68,0.2); }

    /* ── Pref selector ── */
    .pref-row { display: flex; gap: 4px; }
    .pref-btn { flex: 1; padding: 5px 4px; background: #0f172a; color: #64748b; border: 1px solid #334155; border-radius: 6px; font-size: 11px; cursor: pointer; transition: all 0.15s; text-align: center; }
    .pref-btn.active { background: rgba(99,102,241,0.15); border-color: #6366f1; color: #a5b4fc; }

    /* ── Location autocomplete (shared) ── */
    .loc-wrap { position: relative; }
    .loc-hint { font-size: 11px; color: #475569; margin-top: 3px; }
    .loc-confirmed { display: flex; align-items: flex-start; gap: 5px; font-size: 12px; margin-top: 4px; }
    .loc-confirmed-text { color: #86efac; flex: 1; line-height: 1.4; }
    .loc-clear { background: none; border: none; color: #64748b; cursor: pointer; font-size: 14px; padding: 0; }
    .loc-clear:hover { color: #f87171; }
    .loc-dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #1e293b; border: 1px solid #334155; border-radius: 10px; z-index: 9999; max-height: 200px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .loc-item { padding: 8px 11px; cursor: pointer; border-bottom: 1px solid #334155; transition: background 0.12s; }
    .loc-item:last-child { border-bottom: none; }
    .loc-item:hover { background: #334155; }
    .loc-item-name { font-size: 12px; font-weight: 500; color: #e2e8f0; margin-bottom: 1px; }
    .loc-item-detail { font-size: 10px; color: #475569; }

    /* ── Surface chips ── */
    .surface-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .surface-chip { display: flex; align-items: center; gap: 7px; padding: 7px 9px; border: 1px solid #334155; border-radius: 7px; cursor: pointer; transition: all 0.2s; background: #0f172a; font-size: 12px; color: #94a3b8; user-select: none; }
    .surface-chip.active { border-color: #3b82f6; background: rgba(59,130,246,0.1); color: #93c5fd; }

    .api-key-notice { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 7px; padding: 9px 11px; font-size: 11px; color: #fcd34d; margin-bottom: 10px; line-height: 1.5; }
    .api-key-notice a { color: #fbbf24; }

    /* ── Buttons ── */
    .btn-primary { width: 100%; padding: 11px; background: linear-gradient(135deg,#3b82f6,#2563eb); color: white; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(59,130,246,0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-primary.indigo { background: linear-gradient(135deg,#6366f1,#4f46e5); }
    .btn-primary.indigo:hover { box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
    .btn-sm { padding: 6px 11px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 7px; font-size: 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .btn-sm:hover { background: #334155; color: #f8fafc; }
    .btn-sm.hi { background: rgba(59,130,246,0.15); border-color: #3b82f6; color: #93c5fd; }
    .btn-danger { padding: 5px 9px; background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.3); border-radius: 6px; font-size: 12px; cursor: pointer; }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }

    /* ── Main ── */
    .main { flex: 1; padding: 22px; overflow-y: auto; background: #0f172a; }
    .tabs { display: flex; gap: 2px; margin-bottom: 20px; background: #1e293b; padding: 4px; border-radius: 11px; border: 1px solid #334155; }
    .tab { flex: 1; padding: 8px 14px; background: transparent; border: none; color: #64748b; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
    .tab.active { background: #3b82f6; color: white; }

    /* ── Spinners ── */
    .spinner-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; color: #64748b; }
    .spinner { width: 44px; height: 44px; border: 3px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-inline { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .spin-sm { display: inline-block; width: 11px; height: 11px; border: 2px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }

    .error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 11px; padding: 13px 16px; color: #f87171; margin-bottom: 18px; display: flex; align-items: flex-start; gap: 10px; }

    /* ── Route cards ── */
    .routes-grid { display: grid; gap: 18px; }
    .route-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; overflow: hidden; transition: border-color 0.2s; }
    .route-card.selected { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    .route-card-header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: linear-gradient(135deg,#1e293b,#162032); }
    .route-type-badge { display: flex; align-items: center; gap: 9px; }
    .route-icon { width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 19px; }
    .route-icon.flat     { background: rgba(34,197,94,0.15); }
    .route-icon.hilly    { background: rgba(245,158,11,0.15); }
    .route-icon.mountain { background: rgba(239,68,68,0.15); }
    .route-icon.manual   { background: rgba(99,102,241,0.15); }
    .route-name { font-size: 15px; font-weight: 600; color: #f8fafc; }
    .route-tagline { font-size: 11px; color: #64748b; margin-top: 2px; }
    .difficulty-badge { padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .diff-easy    { background: rgba(34,197,94,0.15);  color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .diff-medium  { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .diff-hard    { background: rgba(239,68,68,0.15);  color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .diff-extreme { background: rgba(168,85,247,0.15); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
    .route-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #334155; border-top: 1px solid #334155; }
    .stat-item { background: #0f172a; padding: 11px; text-align: center; }
    .stat-value { font-size: 17px; font-weight: 700; color: #f8fafc; }
    .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 1px; }

    /* ── Edit toolbar ── */
    .edit-toolbar { padding: 9px 14px; border-top: 1px solid #334155; display: flex; gap: 7px; align-items: center; background: rgba(15,23,42,0.5); flex-wrap: wrap; }
    .edit-toolbar-label { font-size: 12px; color: #64748b; flex: 1; min-width: 80px; display: flex; align-items: center; gap: 5px; }

    /* ── Waypoint panel inside route card (below map) ── */
    .wpp { border-top: 1px solid #334155; background: #090f1a; }
    .wpp-header { padding: 8px 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; border-bottom: 1px solid #1e293b; }
    .wpp-header:hover { background: rgba(255,255,255,0.02); }
    .wpp-header-label { font-size: 12px; font-weight: 600; color: #94a3b8; flex: 1; }
    .wpp-row { display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-bottom: 1px solid #0f172a; }
    .wpp-row.fixed { background: rgba(34,197,94,0.03); }
    .wpp-badge { width: 21px; height: 21px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .wpp-badge.via { background: #f59e0b; color: #fff; }
    .wpp-badge.se { font-size: 13px; }
    .wpp-name { flex: 1; font-size: 12px; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wpp-name.fixed { color: #86efac; }
    .wpp-actions { display: flex; gap: 3px; flex-shrink: 0; }
    .wpp-btn { background: none; border: 1px solid #334155; color: #64748b; border-radius: 4px; width: 21px; height: 21px; cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; }
    .wpp-btn:hover:not(:disabled) { background: #334155; color: #f8fafc; }
    .wpp-btn:disabled { opacity: 0.2; cursor: default; }
    .wpp-btn.del { border-color: rgba(239,68,68,0.3); color: #f87171; background: rgba(239,68,68,0.07); }
    .wpp-btn.del:hover { background: rgba(239,68,68,0.2); }
    .wpp-search { padding: 7px 12px; border-top: 1px solid #1e293b; }

    /* ── Map ── */
    .map-wrap { position: relative; }
    .route-map { height: 280px; background: #0a1628; }
    .route-map.edit { height: 300px; }
    .map-hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(9,15,26,0.92); color: #94a3b8; padding: 5px 13px; border-radius: 20px; font-size: 11px; z-index: 999; white-space: nowrap; border: 1px solid #334155; pointer-events: none; }
    .map-rerouting { position: absolute; top: 10px; right: 10px; background: rgba(9,15,26,0.92); color: #60a5fa; padding: 4px 11px; border-radius: 7px; font-size: 12px; z-index: 999; display: flex; align-items: center; gap: 5px; border: 1px solid #334155; }

    /* ── Actions / elevation ── */
    .route-actions { padding: 11px 14px; border-top: 1px solid #334155; display: flex; gap: 7px; align-items: center; }
    .save-input { flex: 1; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 6px 11px; border-radius: 7px; font-size: 13px; outline: none; }
    .save-input:focus { border-color: #3b82f6; }
    .elevation-container { padding: 13px 14px; border-top: 1px solid #334155; }
    .elevation-title { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; }

    /* ── Saved cards ── */
    .saved-card { background: #1e293b; border: 1px solid #334155; border-radius: 13px; overflow: hidden; margin-bottom: 10px; transition: border-color 0.2s; }
    .saved-card.expanded { border-color: #3b82f6; }
    .saved-card-header { padding: 11px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .saved-card-header:hover { background: rgba(255,255,255,0.02); }
    .saved-card-name { font-size: 14px; font-weight: 600; color: #f8fafc; }
    .saved-card-meta { font-size: 11px; color: #64748b; margin-top: 2px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .saved-card-btns { margin-left: auto; display: flex; gap: 5px; flex-shrink: 0; }

    /* ── Profile ── */
    .profile-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 18px; margin-bottom: 18px; }
    .profile-avatar { width: 56px; height: 56px; background: linear-gradient(135deg,#3b82f6,#6366f1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 14px; }

    /* ── Empty ── */
    .empty-state { text-align: center; padding: 50px 20px; }
    .empty-icon { font-size: 44px; margin-bottom: 14px; }
    .empty-title { font-size: 17px; font-weight: 600; color: #64748b; margin-bottom: 7px; }
    .empty-text { font-size: 13px; color: #475569; line-height: 1.6; }

    /* ── Manual route rerouting notice ── */
    .manual-status { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(99,102,241,0.1); border-bottom: 1px solid rgba(99,102,241,0.2); font-size: 12px; color: #a5b4fc; }

    @media (max-width: 768px) {
      #root { flex-direction: column; }
      .sidebar { width: 100%; min-width: unset; height: auto; position: relative; }
      .route-stats { grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  const ORS_BASE       = 'https://api.openrouteservice.org/v2';
  const NOMINATIM_BASE = 'https://nominatim.openstreetmap.org';

  const SURFACE_OPTIONS = [
    {id:'asphalt',label:'Asphalt', icon:'🛣️'},
    {id:'gravel', label:'Schotter',icon:'🪨'},
    {id:'pebble', label:'Kies',    icon:'⚪'},
    {id:'dirt',   label:'Feldweg', icon:'🌿'},
  ];
  const ROUTE_TYPES = [
    {id:'flat',    label:'Flach',   icon:'🏁',tagline:'Ideal für Tempo & Ausdauer',   color:'#22c55e',pref:'fastest',    seed:1},
    {id:'hilly',   label:'Hügelig', icon:'⛰️',tagline:'Abwechslungsreich & kraftvoll',color:'#f59e0b',pref:'recommended',seed:2},
    {id:'mountain',label:'Bergig',  icon:'🏔️',tagline:'Herausfordernd & spektakulär', color:'#ef4444',pref:'shortest',   seed:3},
  ];
  const PREFS = [
    {id:'fastest',    label:'⚡ Schnell'},
    {id:'recommended',label:'⭐ Ausgewogen'},
    {id:'shortest',   label:'🏔️ Malerisch'},
  ];

  // ── Helpers ──────────────────────────────────────────────────────────────
  function calcDifficulty(d,e){const s=d*0.5+e*0.02;if(s<30)return{label:'Leicht',cls:'diff-easy'};if(s<70)return{label:'Mittel',cls:'diff-medium'};if(s<130)return{label:'Schwer',cls:'diff-hard'};return{label:'Extrem',cls:'diff-extreme'};}
  function formatDuration(d,spd){const h=d/spd,hrs=Math.floor(h),m=Math.round((h-hrs)*60);return hrs>0?`${hrs}h ${m}m`:`${m}m`;}
  function parseCoords(t){const m=t.trim().match(/^(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)$/);if(!m)return null;const a=parseFloat(m[1]),b=parseFloat(m[2]);if(a>=-90&&a<=90&&b>=-180&&b<=180)return[b,a];return null;}
  function buildElevProfile(coords,distKm){const step=Math.max(1,Math.floor(coords.length/80));return coords.filter((_,i)=>i%step===0).map((c,i)=>({d:parseFloat((i*step/coords.length*distKm).toFixed(2)),ele:c[2]||0}));}
  function gpx(name,coords){const pts=coords.map(([lon,lat,ele])=>`    <trkpt lat="${lat.toFixed(6)}" lon="${lon.toFixed(6)}">${ele!=null?`<ele>${ele.toFixed(1)}</ele>`:''}</trkpt>`).join('\n');return`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Rennrad Routenplaner" xmlns="http://www.topografix.com/GPX/1/1">\n  <metadata><name>${name}</name></metadata>\n  <trk><name>${name}</name><trkseg>\n${pts}\n  </trkseg></trk>\n</gpx>`;}
  function downloadGPX(name,coords){const b=new Blob([gpx(name,coords)],{type:'application/gpx+xml'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`${name.replace(/\s+/g,'_')}.gpx`;a.click();URL.revokeObjectURL(u);}
  function shortAddress(item){const a=item.address||{};return[a.road||a.pedestrian||a.path||a.suburb,a.city||a.town||a.village||a.county,a.country].filter(Boolean).join(', ')||item.display_name;}

  // ── API ───────────────────────────────────────────────────────────────────
  async function orsPost(apiKey,body){
    const res=await fetch(`${ORS_BASE}/directions/cycling-road/geojson`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':apiKey},body:JSON.stringify(body)});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`API-Fehler ${res.status}`);}
    return(await res.json()).features[0];
  }
  async function fetchRoundTrip(ak,sc,dk,pref,seed){return orsPost(ak,{coordinates:[sc],options:{round_trip:{length:dk*1000,points:3,seed}},elevation:true,instructions:false,preference:pref});}
  async function fetchViaRoute(ak,wps,pref){return orsPost(ak,{coordinates:wps,elevation:true,instructions:false,preference:pref});}
  function parseFeature(feat,typeId){const c=feat.geometry.coordinates,s=feat.properties.summary,dk=parseFloat((s.distance/1000).toFixed(1));return{type:typeId,coords:c,distKm:dk,elevUp:Math.round(s.ascent||0),elevDown:Math.round(s.descent||0),elevProfile:buildElevProfile(c,dk)};}
  async function reverseGeocode(lon,lat){
    try{const r=await fetch(`${NOMINATIM_BASE}/reverse?lat=${lat.toFixed(6)}&lon=${lon.toFixed(6)}&format=json&zoom=16`,{headers:{'Accept-Language':'de'}});const d=await r.json();if(d.error)return`${lat.toFixed(4)}, ${lon.toFixed(4)}`;const a=d.address||{};return[a.road||a.pedestrian||a.path||a.suburb,a.city||a.town||a.village||a.county].filter(Boolean).join(', ')||`${lat.toFixed(4)}, ${lon.toFixed(4)}`;}
    catch{return`${lat.toFixed(4)}, ${lon.toFixed(4)}`;}
  }

  // ── Shared location search component ─────────────────────────────────────
  // mode='confirm': holds confirmed state (for sidebar start point)
  // mode='oneshot': clears after selection (for adding waypoints)
  function GeoSearch({mode='confirm', placeholder='Ort oder Koordinaten…', onSelect, onClear}) {
    const [text,setText]=useState('');
    const [sugg,setSugg]=useState([]);
    const [busy,setBusy]=useState(false);
    const [conf,setConf]=useState(null);
    const tmr=useRef(null), wrap=useRef(null);

    useEffect(()=>{
      const h=e=>{if(wrap.current&&!wrap.current.contains(e.target))setSugg([]);};
      document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);
    },[]);

    const pick=(label,coord)=>{
      if(mode==='confirm'){setText(label);setConf({label,coord});setSugg([]);}
      else{setText('');setSugg([]);}
      onSelect(coord,label);
    };
    const clear=()=>{setText('');setConf(null);setSugg([]);if(onClear)onClear();};

    const onChange=e=>{
      const v=e.target.value;setText(v);
      if(mode==='confirm'){setConf(null);if(onClear)onClear();}
      setSugg([]);clearTimeout(tmr.current);
      if(!v.trim())return;
      const coord=parseCoords(v);
      if(coord){pick(`📍 ${parseFloat(coord[1].toFixed(5))}, ${parseFloat(coord[0].toFixed(5))}`,coord);return;}
      if(v.trim().length<3)return;
      setBusy(true);
      tmr.current=setTimeout(async()=>{
        try{const r=await fetch(`${NOMINATIM_BASE}/search?q=${encodeURIComponent(v)}&format=json&limit=5&addressdetails=1`,{headers:{'Accept-Language':'de'}});setSugg(await r.json());}catch{}
        setBusy(false);
      },450);
    };

    return(
      <div className="loc-wrap" ref={wrap}>
        <input type="text" value={text} onChange={onChange} placeholder={placeholder}
          style={conf?{borderColor:'#22c55e'}:{}} autoComplete="off"/>
        {mode==='confirm'&&<div className="loc-hint">z. B. „Hamburg, Rathausmarkt" oder „53.55, 10.00"</div>}
        {conf&&mode==='confirm'&&(
          <div className="loc-confirmed">
            <span style={{color:'#4ade80'}}>✓</span>
            <span className="loc-confirmed-text">{conf.label}</span>
            <button className="loc-clear" onClick={clear}>✕</button>
          </div>
        )}
        {(sugg.length>0||busy)&&!conf&&(
          <div className="loc-dropdown">
            {busy&&<div style={{padding:'8px 11px',fontSize:11,color:'#64748b'}}>Suche…</div>}
            {sugg.map((s,i)=>(
              <div key={i} className="loc-item" onClick={()=>pick(shortAddress(s),[parseFloat(s.lon),parseFloat(s.lat)])}>
                <div className="loc-item-name">{shortAddress(s)}</div>
                <div className="loc-item-detail">{s.display_name}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // ── ElevationChart ────────────────────────────────────────────────────────
  function ElevationChart({data,color}){
    if(!data||data.length<2)return null;
    const W=560,H=100,pad={top:6,right:6,bottom:20,left:36};
    const cW=W-pad.left-pad.right,cH=H-pad.top-pad.bottom;
    const eles=data.map(d=>d.ele),minE=Math.min(...eles),maxE=Math.max(...eles),rng=maxE-minE||1;
    const maxD=data[data.length-1].d||1;
    const x=d=>pad.left+(d/maxD)*cW, y=e=>pad.top+(1-(e-minE)/rng)*cH;
    const pts=data.map(d=>`${x(d.d).toFixed(1)},${y(d.ele).toFixed(1)}`).join(' ');
    const area=`${x(0).toFixed(1)},${(pad.top+cH).toFixed(1)} ${pts} ${x(maxD).toFixed(1)},${(pad.top+cH).toFixed(1)}`;
    const gid=`eg${color.replace('#','')}`;
    return(
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
        <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.45"/><stop offset="100%" stopColor={color} stopOpacity="0.04"/></linearGradient></defs>
        <polygon points={area} fill={`url(#${gid})`}/>
        <polyline points={pts} fill="none" stroke={color} strokeWidth="1.8" strokeLinejoin="round"/>
        {[minE,minE+rng*0.5,maxE].map(v=><text key={v} x={pad.left-3} y={y(v)+3.5} textAnchor="end" fontSize="9" fill="#64748b">{Math.round(v)}m</text>)}
        {[0,maxD*0.5,maxD].map((v,i)=><text key={i} x={x(v)} y={H-3} textAnchor="middle" fontSize="9" fill="#64748b">{v.toFixed(1)}km</text>)}
        <line x1={pad.left} y1={pad.top} x2={pad.left} y2={pad.top+cH} stroke="#1e293b" strokeWidth="1"/>
        <line x1={pad.left} y1={pad.top+cH} x2={pad.left+cW} y2={pad.top+cH} stroke="#1e293b" strokeWidth="1"/>
      </svg>
    );
  }

  // ── RouteMap (Leaflet) ────────────────────────────────────────────────────
  // markerMode: 'roundtrip' = green start + via numbers
  //             'manual'    = all waypoints numbered 1..N
  function RouteMap({coords, color, mapId, editMode=false, viaCoords=[], allMarkers=null, onAddVia, onMoveVia, rerouting=false}) {
    const mapRef=useRef(null), polyRef=useRef(null), startMkRef=useRef(null);
    const viaMkRef=useRef([]), allMkRef=useRef([]);
    const editRef=useRef(editMode), addRef=useRef(onAddVia);
    useEffect(()=>{editRef.current=editMode;},[editMode]);
    useEffect(()=>{addRef.current=onAddVia;},[onAddVia]);

    // Init map
    useEffect(()=>{
      const el=document.getElementById(mapId);if(!el)return;
      if(mapRef.current){mapRef.current.remove();mapRef.current=null;}
      const map=L.map(el,{zoomControl:true,attributionControl:false});mapRef.current=map;
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
      map.on('click',e=>{if(editRef.current&&addRef.current)addRef.current([e.latlng.lng,e.latlng.lat]);});
      return()=>{if(mapRef.current){mapRef.current.remove();mapRef.current=null;}};
    },[mapId]);

    // Update polyline
    useEffect(()=>{
      if(!mapRef.current||!coords||!coords.length)return;
      if(polyRef.current){polyRef.current.remove();polyRef.current=null;}
      if(startMkRef.current){startMkRef.current.remove();startMkRef.current=null;}
      const ll=coords.map(c=>[c[1],c[0]]);
      polyRef.current=L.polyline(ll,{color,weight:4,opacity:0.9}).addTo(mapRef.current);
      startMkRef.current=L.marker(ll[0],{icon:L.divIcon({html:'🟢',className:'',iconSize:[20,20]})}).addTo(mapRef.current);
      mapRef.current.fitBounds(polyRef.current.getBounds(),{padding:[24,24]});
    },[coords,color]);

    // Cursor + dblclick zoom
    useEffect(()=>{
      if(!mapRef.current)return;
      mapRef.current.getContainer().style.cursor=editMode?'crosshair':'';
      if(editMode)mapRef.current.doubleClickZoom.disable();
      else mapRef.current.doubleClickZoom.enable();
    },[editMode]);

    // Via markers (round-trip edit mode) — numbered, draggable
    useEffect(()=>{
      if(!mapRef.current)return;
      viaMkRef.current.forEach(m=>m.remove());viaMkRef.current=[];
      if(!editMode||!viaCoords.length)return;
      viaCoords.forEach((vp,i)=>{
        const icon=L.divIcon({html:`<div style="background:#f59e0b;color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.5);cursor:grab">${i+1}</div>`,className:'',iconSize:[26,26],iconAnchor:[13,13]});
        const mk=L.marker([vp[1],vp[0]],{draggable:true,icon}).addTo(mapRef.current);
        mk.on('dragend',e=>{const{lat,lng}=e.target.getLatLng();if(onMoveVia)onMoveVia(i,[lng,lat]);});
        viaMkRef.current.push(mk);
      });
    },[viaCoords,editMode,onMoveVia]);

    // All-markers mode (manual route) — numbered, not draggable
    useEffect(()=>{
      if(!mapRef.current)return;
      allMkRef.current.forEach(m=>m.remove());allMkRef.current=[];
      if(!allMarkers||!allMarkers.length)return;
      allMarkers.forEach((wp,i)=>{
        const isFirst=i===0,isLast=i===allMarkers.length-1;
        const bg=isFirst?'#22c55e':isLast?'#ef4444':'#6366f1';
        const html=isFirst?'<div style="font-size:16px">🟢</div>':isLast?'<div style="font-size:16px">🔴</div>':`<div style="background:${bg};color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4)">${i+1}</div>`;
        const mk=L.marker([wp.coord[1],wp.coord[0]],{icon:L.divIcon({html,className:'',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(mapRef.current);
        mk.bindTooltip(wp.name,{direction:'top',offset:[0,-12],className:''}); // native tooltip
        allMkRef.current.push(mk);
      });
    },[allMarkers]);

    return(
      <div className="map-wrap">
        <div id={mapId} className={`route-map${editMode?' edit':''}`}/>
        {editMode&&<div className="map-hint">📍 Klick = Wegpunkt &nbsp;·&nbsp; Marker ziehen = verschieben</div>}
        {rerouting&&<div className="map-rerouting"><span className="spin-sm"/> Neu berechnen…</div>}
      </div>
    );
  }

  // ── RouteCard (round-trip, WaypointPanel now BELOW map) ───────────────────
  function RouteCard({initialRoute,typeInfo,speedKmh,onSave,index,apiKey,startLabel}){
    const [expanded,setExpanded]=useState(false);
    const [editMode,setEditMode]=useState(false);
    const [viaPoints,setViaPoints]=useState([]);
    const [route,setRoute]=useState(initialRoute);
    const [rerouting,setRerouting]=useState(false);
    const [rerouteErr,setRerouteErr]=useState('');
    const [saveName,setSaveName]=useState('');
    const [startName,setStartName]=useState(startLabel||'');
    const viaRef=useRef([]),reqId=useRef(0);
    const diff=calcDifficulty(route.distKm,route.elevUp);
    const dur=formatDuration(route.distKm,speedKmh);
    const sc=initialRoute.coords[0].slice(0,2);

    useEffect(()=>{if(editMode&&!startName)reverseGeocode(sc[0],sc[1]).then(setStartName);},[editMode]);

    const rerouteWith=useCallback(async(coords)=>{
      const id=++reqId.current;setRerouting(true);setRerouteErr('');
      try{
        const feat=coords.length===0
          ?await fetchRoundTrip(apiKey,sc,initialRoute.distKm,typeInfo.pref,typeInfo.seed)
          :await fetchViaRoute(apiKey,[sc,...coords,sc],typeInfo.pref);
        if(id!==reqId.current)return;
        setRoute(parseFeature(feat,initialRoute.type));
      }catch(e){if(id===reqId.current)setRerouteErr(e.message);}
      finally{if(id===reqId.current)setRerouting(false);}
    },[apiKey,sc,initialRoute,typeInfo]);

    const updateVia=useCallback(nv=>{viaRef.current=nv;setViaPoints(nv);rerouteWith(nv.map(v=>v.coord));},[rerouteWith]);
    const handleAddVia=useCallback(async(coord,nameOvr)=>{
      const name=nameOvr||await reverseGeocode(coord[0],coord[1]);
      updateVia([...viaRef.current,{coord,name}]);
    },[updateVia]);
    const handleMoveVia=useCallback((i,coord)=>{
      const nv=[...viaRef.current];nv[i]={...nv[i],coord};
      reverseGeocode(coord[0],coord[1]).then(name=>{const l=[...viaRef.current];if(l[i]){l[i]={...l[i],name};viaRef.current=l;setViaPoints([...l]);}});
      updateVia(nv);
    },[updateVia]);
    const handleRemoveVia=useCallback(i=>updateVia(viaRef.current.filter((_,j)=>j!==i)),[updateVia]);
    const handleReorder=useCallback((from,to)=>{if(to<0||to>=viaRef.current.length)return;const nv=[...viaRef.current];[nv[from],nv[to]]=[nv[to],nv[from]];updateVia(nv);},[updateVia]);
    const resetEdit=()=>{viaRef.current=[];setViaPoints([]);setRoute(initialRoute);setEditMode(false);setRerouteErr('');};

    return(
      <div className={`route-card ${expanded?'selected':''}`}>
        <div className="route-card-header" onClick={()=>!editMode&&setExpanded(e=>!e)}>
          <div className="route-type-badge">
            <div className={`route-icon ${route.type}`}>{typeInfo.icon}</div>
            <div><div className="route-name">{typeInfo.label}</div><div className="route-tagline">{typeInfo.tagline}</div></div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:7}}>
            <span className={`difficulty-badge ${diff.cls}`}>{diff.label}</span>
            <span style={{color:'#64748b',fontSize:15}}>{expanded?'▲':'▼'}</span>
          </div>
        </div>
        <div className="route-stats">
          {[{icon:'📏',v:route.distKm,l:'km'},{icon:'⬆️',v:route.elevUp,l:'m Aufstieg'},{icon:'⬇️',v:route.elevDown,l:'m Abstieg'},{icon:'⏱️',v:dur,l:'Dauer',sm:true}].map(({icon,v,l,sm})=>(
            <div key={l} className="stat-item"><div style={{fontSize:13,marginBottom:2}}>{icon}</div><div className="stat-value" style={sm?{fontSize:14}:{}}>{v}</div><div className="stat-label">{l}</div></div>
          ))}
        </div>
        {expanded&&(
          <>
            <div className="edit-toolbar">
              {!editMode
                ?<button className="btn-sm" onClick={()=>setEditMode(true)}>✏️ Route manuell anpassen</button>
                :<><div className="edit-toolbar-label">{rerouting?<><span className="spin-sm"/> Neu berechnen…</>:`${viaPoints.length} Wegpunkt${viaPoints.length!==1?'e':''}`}</div><button className="btn-sm" onClick={resetEdit}>↩️ Zurücksetzen</button><button className="btn-sm hi" onClick={()=>setEditMode(false)}>✅ Fertig</button></>
              }
            </div>
            {rerouteErr&&<div style={{padding:'5px 14px',color:'#f87171',fontSize:12}}>⚠️ {rerouteErr}</div>}

            {/* MAP first */}
            <RouteMap coords={route.coords} color={typeInfo.color} mapId={`map-${index}`}
              editMode={editMode} viaCoords={viaPoints.map(v=>v.coord)} rerouting={rerouting}
              onAddVia={handleAddVia} onMoveVia={handleMoveVia}/>

            {/* WAYPOINT PANEL below map — always visible when scrolling */}
            {editMode&&(
              <WaypointPanel viaPoints={viaPoints} startName={startName}
                onAdd={handleAddVia} onRemove={handleRemoveVia} onReorder={handleReorder}/>
            )}

            <div className="elevation-container"><div className="elevation-title">Höhenprofil</div><ElevationChart data={route.elevProfile} color={typeInfo.color}/></div>
            <div className="route-actions">
              <input className="save-input" placeholder="Tourname…" value={saveName} onChange={e=>setSaveName(e.target.value)}/>
              <button className="btn-sm" onClick={()=>{if(saveName.trim()){onSave(route,saveName.trim());setSaveName('');}}}>💾 Speichern</button>
              <button className="btn-sm" onClick={()=>downloadGPX(saveName||typeInfo.label,route.coords)}>⬇️ GPX</button>
            </div>
          </>
        )}
      </div>
    );
  }

          <button className="btn-sm" onClick={()=>downloadGPX(saveName||'Manuelle Route',route.coords)}>⬇️ GPX</button>
        </div>

  function ProfilePanel({profile,onChange}){

          <div className="profile-avatar">🚴</div>
          <div className="form-group"><label>Name</label><input type="text" value={profile.name} onChange={e=>onChange({...profile,name:e.target.value})} placeholder="Dein Name"/></div>
          <div className="form-group">
            <label>Durchschnittsgeschwindigkeit</label>
            <input type="range" min="10" max="45" step="1" value={profile.speed} onChange={e=>onChange({...profile,speed:+e.target.value})}/>
            <div className="range-display"><span className="range-value">{profile.speed}</span><span className="range-unit">km/h</span></div>
          </div>

        <div style={{background:'#1e293b',borderRadius:11,border:'1px solid #334155',padding:14,fontSize:13,color:'#94a3b8',lineHeight:1.7}}>
          <strong style={{color:'#f8fafc',display:'block',marginBottom:5}}>OpenRouteService API-Key</strong>
          Kostenlosen Key bei <a href="https://openrouteservice.org" target="_blank" rel="noreferrer" style={{color:'#60a5fa'}}>openrouteservice.org</a> (2.000 Anfragen/Tag) und links eintragen.
        </div>
      </div>
    );
  }

  // ── App ───────────────────────────────────────────────────────────────────
  function App(){
    // shared
    const [apiKey,setApiKey]=useState('');
    const [planMode,setPlanMode]=useState('roundtrip'); // 'roundtrip'|'manual'
    const [profile,setProfile]=useState({name:'Fahrer',speed:25});
    const [savedTours,setSavedTours]=useState([]);
    const [activeTab,setActiveTab]=useState('routes');

    // round-trip
    const [startCoord,setStartCoord]=useState(null);
    const [startLabel,setStartLabel]=useState('');
    const [distKm,setDistKm]=useState(80);
    const [surfaces,setSurfaces]=useState(['asphalt']);
    const [rtLoading,setRtLoading]=useState(false);
    const [rtError,setRtError]=useState('');
    const [rtRoutes,setRtRoutes]=useState([]);

    // manual
    const [manWaypoints,setManWaypoints]=useState([]); // [{coord,name}]
    const [manPref,setManPref]=useState('recommended');
    const [manLoop,setManLoop]=useState(false);
    const [manRoute,setManRoute]=useState(null);
    const [manLoading,setManLoading]=useState(false);
    const [manError,setManError]=useState('');
    const manWpRef=useRef([]);
    const manReqId=useRef(0);

    // ── Round-trip planning ──
    const planRoundTrips=async()=>{
      if(!apiKey.trim()){setRtError('Bitte trage deinen API-Key ein.');return;}
      if(!startCoord){setRtError('Bitte wähle einen gültigen Startpunkt.');return;}
      setRtLoading(true);setRtError('');setRtRoutes([]);
      try{
        const results=await Promise.all(ROUTE_TYPES.map(async t=>{
          const feat=await fetchRoundTrip(apiKey,startCoord,distKm,t.pref,t.seed);
          return parseFeature(feat,t.id);
        }));
        setRtRoutes(results);setActiveTab('routes');
      }catch(e){setRtError(e.message||'Fehler bei der Routenplanung.');}
      finally{setRtLoading(false);}
    };

    // ── Manual route auto-recalc ──
    const recalcManual=useCallback(async(wps,pref,loop)=>{
      if(!apiKey.trim()||wps.length<2){setManRoute(null);return;}
      const id=++manReqId.current;setManLoading(true);setManError('');
      try{
        const coords=wps.map(w=>w.coord);
        const waypoints=loop?[...coords,coords[0]]:coords;
        const feat=await fetchViaRoute(apiKey,waypoints,pref);
        if(id!==manReqId.current)return;
        setManRoute(parseFeature(feat,'manual'));
      }catch(e){if(id===manReqId.current)setManError(e.message);}
      finally{if(id===manReqId.current)setManLoading(false);}
    },[apiKey]);

    const updateManWaypoints=useCallback(nv=>{
      manWpRef.current=nv;setManWaypoints(nv);recalcManual(nv,manPref,manLoop);
    },[recalcManual,manPref,manLoop]);

    // Re-calc when pref/loop changes
    useEffect(()=>{if(manWpRef.current.length>=2)recalcManual(manWpRef.current,manPref,manLoop);},[manPref,manLoop,recalcManual]);

    const addManWp=useCallback(async(coord,nameOvr)=>{
      const name=nameOvr||await reverseGeocode(coord[0],coord[1]);
      updateManWaypoints([...manWpRef.current,{coord,name}]);
    },[updateManWaypoints]);
    const removeManWp=useCallback(i=>updateManWaypoints(manWpRef.current.filter((_,j)=>j!==i)),[updateManWaypoints]);
    const reorderManWp=useCallback((from,to)=>{
      if(to<0||to>=manWpRef.current.length)return;
      const nv=[...manWpRef.current];[nv[from],nv[to]]=[nv[to],nv[from]];updateManWaypoints(nv);
    },[updateManWaypoints]);

    return(
      <>
        {/* ── SIDEBAR ── */}
        <aside className="sidebar">
          <div className="sidebar-header">
            <div className="app-title"><span style={{fontSize:26}}>🚴</span><div><div>Rennrad Planer</div><div className="app-subtitle">Routen für jeden Anspruch</div></div></div>
          </div>

          {/* Mode selector */}
          <div className="sidebar-section">
            <div className="mode-tabs">
              <button className={`mode-tab ${planMode==='roundtrip'?'active':''}`} onClick={()=>setPlanMode('roundtrip')}>🔄 Rundtour</button>
              <button className={`mode-tab ${planMode==='manual'?'active':''}`} onClick={()=>setPlanMode('manual')}>📍 Manuell</button>
            </div>
          </div>

          {/* API Key */}
          <div className="sidebar-section">
            <div className="section-title">🔑 API-Zugang</div>
            <div className="api-key-notice">Key bei <a href="https://openrouteservice.org" target="_blank" rel="noreferrer">openrouteservice.org</a> — 2.000/Tag gratis.</div>
            <input type="text" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="5b3ce3…"/>
          </div>

          {/* ── RUNDTOUR mode ── */}
          {planMode==='roundtrip'&&(
            <>
              <div className="sidebar-section">
                <div className="section-title">📍 Startpunkt & Distanz</div>
                <div className="form-group">
                  <label>Startpunkt</label>
                  <GeoSearch mode="confirm" placeholder="Ort, Adresse oder Koordinaten" onSelect={(coord,label)=>{setStartCoord(coord);setStartLabel(label||'');}} onClear={()=>{setStartCoord(null);setStartLabel('');}}/>
                </div>
                <div className="form-group">
                  <label>Streckenlänge</label>
                  <input type="range" min="20" max="250" step="5" value={distKm} onChange={e=>setDistKm(+e.target.value)}/>
                  <div className="range-display"><span className="range-value">{distKm}</span><span className="range-unit">km</span></div>
                </div>
              </div>
              <div className="sidebar-section">
                <div className="section-title">🛤️ Belagsarten</div>
                <div className="surface-grid">
                  {SURFACE_OPTIONS.map(s=>(
                    <label key={s.id} className={`surface-chip ${surfaces.includes(s.id)?'active':''}`}>
                      <input type="checkbox" checked={surfaces.includes(s.id)} onChange={()=>setSurfaces(p=>p.includes(s.id)?p.filter(x=>x!==s.id):[...p,s.id])} style={{display:'none'}}/>
                      <span>{s.icon}</span><span>{s.label}</span>
                    </label>
                  ))}
                </div>
              </div>
              <div className="sidebar-section">
                <div className="section-title">⚡ Geschwindigkeit</div>
                <label>Ø <strong style={{color:'#3b82f6'}}>{profile.speed} km/h</strong></label>
                <input type="range" min="10" max="45" step="1" value={profile.speed} onChange={e=>setProfile(p=>({...p,speed:+e.target.value}))}/>
              </div>
              <div className="sidebar-section">
                <button className="btn-primary" onClick={planRoundTrips} disabled={rtLoading}>
                  {rtLoading?<><span className="spin-inline"/> Plane Routen…</>:<><span>🔄</span> 3 Rundtouren planen</>}
                </button>
              </div>
            </>
          )}

          {/* ── MANUAL mode ── */}
          {planMode==='manual'&&(
            <>
              <div className="sidebar-section" style={{flex:1}}>
                <div className="section-title">📍 Wegpunkte</div>
                <div className="mwp-list">
                  {manWaypoints.length===0&&<div className="mwp-empty">Noch keine Wegpunkte.<br/>Füge Orte in der gewünschten Reihenfolge hinzu.</div>}
                  {manWaypoints.map((wp,i)=>{
                    const isFirst=i===0,isLast=i===manWaypoints.length-1&&manWaypoints.length>1;
                    return(
                      <div key={i} className="mwp-row">
                        <span className={`mwp-badge ${isFirst?'first':isLast&&!manLoop?'last':''}`} style={(!isFirst&&!(isLast&&!manLoop))?{background:'#6366f1'}:{}}>
                          {isFirst?'🟢':isLast&&!manLoop?'🔴':i+1}
                        </span>
                        <span className="mwp-name" title={wp.name}>{wp.name}</span>
                        <div className="mwp-actions">
                          <button className="mwp-btn" onClick={()=>reorderManWp(i,i-1)} disabled={i===0}>↑</button>
                          <button className="mwp-btn" onClick={()=>reorderManWp(i,i+1)} disabled={i===manWaypoints.length-1}>↓</button>
                          <button className="mwp-btn del" onClick={()=>removeManWp(i)}>✕</button>
                        </div>
                      </div>
                    );
                  })}
                  {manLoop&&manWaypoints.length>0&&(
                    <div className="mwp-row" style={{opacity:0.5}}>
                      <span className="mwp-badge last">🔴</span>
                      <span className="mwp-name" style={{color:'#86efac'}}>{manWaypoints[0].name} (Ziel)</span>
                    </div>
                  )}
                </div>
                <div style={{marginTop:10}}>
                  <GeoSearch mode="oneshot" placeholder="➕ Ort suchen oder Koordinaten…" onSelect={addManWp}/>
                </div>
              </div>

              <div className="sidebar-section">
                <div className="section-title">🔀 Routenpräferenz</div>
                <div className="pref-row">
                  {PREFS.map(p=>(
                    <button key={p.id} className={`pref-btn ${manPref===p.id?'active':''}`} onClick={()=>setManPref(p.id)}>{p.label}</button>
                  ))}
                </div>
              </div>

              <div className="sidebar-section">
                <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13,color:'#94a3b8'}}>
                  <input type="checkbox" checked={manLoop} onChange={e=>setManLoop(e.target.checked)} style={{accentColor:'#6366f1',width:14,height:14}}/>
                  Rundtour (zurück zum Startpunkt)
                </label>
              </div>

              <div className="sidebar-section">
                <div className="section-title">⚡ Geschwindigkeit</div>
                <label>Ø <strong style={{color:'#3b82f6'}}>{profile.speed} km/h</strong></label>
                <input type="range" min="10" max="45" step="1" value={profile.speed} onChange={e=>setProfile(p=>({...p,speed:+e.target.value}))}/>
              </div>
            </>
          )}
        </aside>

        {/* ── MAIN ── */}
        <main className="main">
          <div className="tabs">
            <button className={`tab ${activeTab==='routes'?'active':''}`} onClick={()=>setActiveTab('routes')}>🗺️ Routen{planMode==='roundtrip'&&rtRoutes.length>0?` (${rtRoutes.length})`:planMode==='manual'&&manRoute?' (1)':''}</button>
            <button className={`tab ${activeTab==='saved'?'active':''}`} onClick={()=>setActiveTab('saved')}>💾 Gespeichert{savedTours.length>0?` (${savedTours.length})`:''}</button>
            <button className={`tab ${activeTab==='profile'?'active':''}`} onClick={()=>setActiveTab('profile')}>👤 Profil</button>
          </div>

          {activeTab==='routes'&&(
            <>
              {/* Roundtrip mode */}
              {planMode==='roundtrip'&&(
                <>
                  {rtError&&<div className="error-box"><span style={{fontSize:19,flexShrink:0}}>⚠️</span><div><strong>Fehler:</strong> {rtError}</div></div>}
                  {rtLoading&&<div className="spinner-overlay"><div className="spinner"/><div>Berechne 3 Rundtouren…</div></div>}
                  {!rtLoading&&rtRoutes.length===0&&(
                    <div className="empty-state"><div className="empty-icon">🔄</div><div className="empty-title">Bereit für deine Rundtour?</div><div className="empty-text">Wähle links Startpunkt und Distanz, dann „3 Rundtouren planen".</div></div>
                  )}
                  {!rtLoading&&rtRoutes.length>0&&(
                    <div className="routes-grid">
                      {rtRoutes.map((r,i)=>(
                        <RouteCard key={i} index={i} initialRoute={r} apiKey={apiKey} startLabel={startLabel}
                          typeInfo={ROUTE_TYPES.find(t=>t.id===r.type)} speedKmh={profile.speed}
                          onSave={(r,n)=>setSavedTours(p=>[...p,{name:n,route:r}])}/>
                      ))}
                    </div>
                  )}
                </>
              )}

              {/* Manual mode */}
              {planMode==='manual'&&(
                <>
                  {manWaypoints.length<2&&!manLoading&&!manRoute&&(
                    <div className="empty-state"><div className="empty-icon">📍</div><div className="empty-title">Manuelle Route erstellen</div><div className="empty-text">Füge links mindestens 2 Wegpunkte hinzu.<br/>Die Route wird automatisch berechnet und aktualisiert sich beim Umsortieren.</div></div>
                  )}
                  {(manLoading||manRoute||manError)&&(
                    <ManualRouteCard route={manRoute} loading={manLoading} error={manError}
                      speedKmh={profile.speed} waypoints={manWaypoints}
                      onSave={(r,n)=>setSavedTours(p=>[...p,{name:n,route:r}])}/>
                  )}
                </>
              )}
            </>
          )}

          {activeTab==='saved'&&(
            savedTours.length===0
              ?<div className="empty-state"><div className="empty-icon">🗺️</div><div className="empty-title">Noch keine Touren gespeichert</div><div className="empty-text">Plane eine Route und speichere sie hier.</div></div>
              :<div>{savedTours.map((t,i)=><SavedRouteCard key={i} tour={t} index={i} onDelete={j=>setSavedTours(p=>p.filter((_,k)=>k!==j))}/>)}</div>
          )}

          {activeTab==='profile'&&<ProfilePanel profile={profile} onChange={setProfile}/>}
        </main>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
