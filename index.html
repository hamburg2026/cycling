<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rennrad Routenplaner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    #root { display: flex; min-height: 100vh; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

    /* Sidebar */
    .sidebar {
      width: 340px; min-width: 340px; background: #1e293b;
      border-right: 1px solid #334155; display: flex; flex-direction: column;
      overflow-y: auto; height: 100vh; position: sticky; top: 0;
    }
    .sidebar-header {
      padding: 24px 20px 16px; border-bottom: 1px solid #334155;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    }
    .app-title {
      font-size: 20px; font-weight: 700; color: #f8fafc;
      display: flex; align-items: center; gap: 10px; letter-spacing: -0.3px;
    }
    .app-subtitle { font-size: 12px; color: #64748b; margin-top: 4px; }
    .sidebar-section { padding: 16px 20px; border-bottom: 1px solid #1e293b; }
    .section-title {
      font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase;
      letter-spacing: 0.8px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
    }
    .form-group { margin-bottom: 12px; }
    label { font-size: 13px; color: #94a3b8; margin-bottom: 4px; display: block; }
    input[type="text"], input[type="number"], input[type="range"] {
      width: 100%; background: #0f172a; border: 1px solid #334155;
      color: #f8fafc; padding: 8px 12px; border-radius: 8px; font-size: 14px;
      outline: none; transition: border-color 0.2s;
    }
    input[type="text"]:focus, input[type="number"]:focus { border-color: #3b82f6; }
    input[type="range"] { padding: 0; cursor: pointer; accent-color: #3b82f6; }
    .range-display {
      display: flex; justify-content: space-between; align-items: center; margin-top: 4px;
    }
    .range-value { font-size: 18px; font-weight: 700; color: #3b82f6; }
    .range-unit { font-size: 12px; color: #64748b; }

    /* Surface checkboxes */
    .surface-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .surface-chip {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border: 1px solid #334155; border-radius: 8px; cursor: pointer;
      transition: all 0.2s; background: #0f172a; font-size: 13px; color: #94a3b8;
    }
    .surface-chip.active {
      border-color: #3b82f6; background: rgba(59,130,246,0.1); color: #93c5fd;
    }
    .surface-chip input { display: none; }
    .surface-icon { font-size: 16px; }

    /* API Key input */
    .api-key-notice {
      background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3);
      border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #fcd34d;
      margin-bottom: 12px; line-height: 1.5;
    }
    .api-key-notice a { color: #fbbf24; }

    /* Buttons */
    .btn-primary {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center;
      justify-content: center; gap: 8px;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(59,130,246,0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-secondary {
      padding: 7px 14px; background: #1e293b; color: #94a3b8; border: 1px solid #334155;
      border-radius: 7px; font-size: 12px; cursor: pointer; transition: all 0.2s;
    }
    .btn-secondary:hover { background: #334155; color: #f8fafc; }
    .btn-danger {
      padding: 5px 10px; background: rgba(239,68,68,0.1); color: #f87171;
      border: 1px solid rgba(239,68,68,0.3); border-radius: 6px; font-size: 12px;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }

    /* Main content */
    .main {
      flex: 1; padding: 24px; overflow-y: auto; background: #0f172a;
    }
    .main-header { margin-bottom: 24px; }
    .main-title { font-size: 24px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .main-subtitle { font-size: 14px; color: #64748b; }

    /* Spinner */
    .spinner-overlay {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px; color: #64748b;
    }
    .spinner {
      width: 48px; height: 48px; border: 3px solid #334155;
      border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-box {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px; padding: 16px 20px; color: #f87171; margin-bottom: 20px;
      display: flex; align-items: flex-start; gap: 12px;
    }

    /* Route cards */
    .routes-grid { display: grid; gap: 20px; }
    .route-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      overflow: hidden; transition: all 0.3s;
    }
    .route-card:hover { border-color: #3b82f6; box-shadow: 0 0 0 1px rgba(59,130,246,0.2); }
    .route-card.selected { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }
    .route-card-header {
      padding: 16px 20px; display: flex; align-items: center;
      justify-content: space-between; cursor: pointer;
      background: linear-gradient(135deg, #1e293b 0%, #162032 100%);
    }
    .route-type-badge {
      display: flex; align-items: center; gap: 10px;
    }
    .route-icon {
      width: 40px; height: 40px; border-radius: 10px; display: flex;
      align-items: center; justify-content: center; font-size: 20px;
    }
    .route-icon.flat { background: rgba(34,197,94,0.15); }
    .route-icon.hilly { background: rgba(245,158,11,0.15); }
    .route-icon.mountain { background: rgba(239,68,68,0.15); }
    .route-name { font-size: 16px; font-weight: 600; color: #f8fafc; }
    .route-tagline { font-size: 12px; color: #64748b; margin-top: 2px; }

    /* Difficulty badge */
    .difficulty-badge {
      padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .diff-easy { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .diff-medium { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .diff-hard { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .diff-extreme { background: rgba(168,85,247,0.15); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }

    /* Stats row */
    .route-stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
      background: #334155; border-top: 1px solid #334155;
    }
    .stat-item {
      background: #0f172a; padding: 12px; text-align: center;
    }
    .stat-value { font-size: 18px; font-weight: 700; color: #f8fafc; }
    .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
    .stat-icon { font-size: 14px; margin-bottom: 2px; }

    /* Map */
    .route-map-container { padding: 0; }
    .route-map { height: 280px; background: #0f172a; }

    /* Elevation chart */
    .elevation-container {
      padding: 16px 20px; border-top: 1px solid #334155;
    }
    .elevation-title {
      font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    /* Route actions */
    .route-actions {
      padding: 12px 20px; border-top: 1px solid #334155;
      display: flex; gap: 8px; align-items: center;
    }
    .save-input {
      flex: 1; background: #0f172a; border: 1px solid #334155; color: #f8fafc;
      padding: 7px 12px; border-radius: 7px; font-size: 13px; outline: none;
    }
    .save-input:focus { border-color: #3b82f6; }

    /* Saved tours */
    .saved-tour-item {
      background: #0f172a; border: 1px solid #334155; border-radius: 10px;
      padding: 12px 14px; margin-bottom: 8px; display: flex;
      align-items: center; justify-content: space-between;
    }
    .saved-tour-name { font-size: 14px; font-weight: 500; color: #f8fafc; }
    .saved-tour-meta { font-size: 11px; color: #64748b; margin-top: 2px; }
    .saved-tour-actions { display: flex; gap: 6px; }

    /* Tab navigation */
    .tabs {
      display: flex; gap: 2px; margin-bottom: 24px; background: #1e293b;
      padding: 4px; border-radius: 12px; border: 1px solid #334155;
    }
    .tab {
      flex: 1; padding: 8px 16px; background: transparent; border: none;
      color: #64748b; font-size: 14px; font-weight: 500; cursor: pointer;
      border-radius: 9px; transition: all 0.2s;
    }
    .tab.active { background: #3b82f6; color: white; }

    /* Profile panel */
    .profile-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px;
      margin-bottom: 20px;
    }
    .profile-avatar {
      width: 60px; height: 60px; background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin-bottom: 16px;
    }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 60px 20px; color: #475569;
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: 600; color: #64748b; margin-bottom: 8px; }
    .empty-text { font-size: 14px; color: #475569; }

    @media (max-width: 768px) {
      #root { flex-direction: column; }
      .sidebar { width: 100%; min-width: unset; height: auto; position: relative; }
      .route-stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

    // ─── Constants ────────────────────────────────────────────────────────────
    const ORS_BASE = 'https://api.openrouteservice.org/v2';
    const NOMINATIM_BASE = 'https://nominatim.openstreetmap.org';

    const SURFACE_OPTIONS = [
      { id: 'asphalt', label: 'Asphalt', icon: '🛣️' },
      { id: 'gravel', label: 'Schotter', icon: '🪨' },
      { id: 'pebble', label: 'Kies', icon: '⚪' },
      { id: 'dirt', label: 'Feldweg', icon: '🌿' },
    ];

    const ROUTE_TYPES = [
      { id: 'flat', label: 'Flach', icon: '🏁', tagline: 'Ideal für Tempo & Ausdauer', color: '#22c55e', elevationFactor: 0.3 },
      { id: 'hilly', label: 'Hügelig', icon: '⛰️', tagline: 'Abwechslungsreich & kraftvoll', color: '#f59e0b', elevationFactor: 0.7 },
      { id: 'mountain', label: 'Bergig', icon: '🏔️', tagline: 'Herausfordernd & spektakulär', color: '#ef4444', elevationFactor: 1.2 },
    ];

    // ─── Helpers ──────────────────────────────────────────────────────────────
    function calcDifficulty(distKm, elevM) {
      const score = distKm * 0.5 + elevM * 0.02;
      if (score < 30) return { label: 'Leicht', cls: 'diff-easy' };
      if (score < 70) return { label: 'Mittel', cls: 'diff-medium' };
      if (score < 130) return { label: 'Schwer', cls: 'diff-hard' };
      return { label: 'Extrem', cls: 'diff-extreme' };
    }

    function formatDuration(distKm, speedKmh) {
      const h = distKm / speedKmh;
      const hrs = Math.floor(h);
      const mins = Math.round((h - hrs) * 60);
      return hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
    }

    function generateGPX(name, coords) {
      const trkpts = coords.map(([lon, lat, ele]) =>
        `    <trkpt lat="${lat.toFixed(6)}" lon="${lon.toFixed(6)}">${ele != null ? `<ele>${ele.toFixed(1)}</ele>` : ''}</trkpt>`
      ).join('\n');
      return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Rennrad Routenplaner"
  xmlns="http://www.topografix.com/GPX/1/1"
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
  xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
  <metadata><name>${name}</name></metadata>
  <trk>
    <name>${name}</name>
    <trkseg>
${trkpts}
    </trkseg>
  </trk>
</gpx>`;
    }

    function downloadGPX(name, coords) {
      const blob = new Blob([generateGPX(name, coords)], { type: 'application/gpx+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${name.replace(/\s+/g, '_')}.gpx`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ─── ORS API ──────────────────────────────────────────────────────────────
    async function geocode(query) {
      const url = `${NOMINATIM_BASE}/search?q=${encodeURIComponent(query)}&format=json&limit=1`;
      const res = await fetch(url, { headers: { 'Accept-Language': 'de' } });
      const data = await res.json();
      if (!data.length) throw new Error(`Ort "${query}" nicht gefunden.`);
      return [parseFloat(data[0].lon), parseFloat(data[0].lat)];
    }

    async function fetchRoute(apiKey, startCoord, distKm, elevFactor, avoidSurfaces) {
      // Build a waypoint by computing a rough destination ~distKm/2 away, then back
      const [lon, lat] = startCoord;
      const bearings = [0, 90, 180, 270];
      const earthR = 6371;
      const halfDeg = (distKm / 2 / earthR) * (180 / Math.PI);

      // Pick midpoint bearing based on elevFactor for variety
      const bearing = bearings[Math.floor(elevFactor * 4) % 4];
      const rad = bearing * Math.PI / 180;
      const midLat = lat + halfDeg * Math.cos(rad);
      const midLon = lon + halfDeg * Math.sin(rad) / Math.cos(lat * Math.PI / 180);

      const avoidMap = { pebble: 'gravel', dirt: 'unpaved' };
      const avoidArr = avoidSurfaces
        .filter(s => s !== 'asphalt' && s !== 'gravel')
        .map(s => avoidMap[s] || s);

      const body = {
        coordinates: [[lon, lat], [midLon, midLat], [lon, lat]],
        profile: 'cycling-road',
        elevation: true,
        instructions: false,
        preference: elevFactor < 0.5 ? 'fastest' : elevFactor < 1.0 ? 'recommended' : 'shortest',
        options: avoidArr.length ? { avoid_features: avoidArr } : undefined,
      };

      const res = await fetch(`${ORS_BASE}/directions/cycling-road/geojson`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': apiKey,
        },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `API-Fehler (${res.status})`);
      }
      const data = await res.json();
      return data.features[0];
    }

    function parseRoute(feature, type) {
      const coords = feature.geometry.coordinates; // [lon, lat, ele]
      const props = feature.properties.summary;
      const distKm = (props.distance / 1000).toFixed(1);
      const elevUp = Math.round(props.ascent || 0);
      const elevDown = Math.round(props.descent || 0);

      // Build elevation profile data
      const step = Math.max(1, Math.floor(coords.length / 100));
      const elevProfile = coords
        .filter((_, i) => i % step === 0)
        .map((c, i) => ({ d: parseFloat((i * step * props.distance / coords.length / 1000).toFixed(2)), ele: c[2] || 0 }));

      return { type, coords, distKm: parseFloat(distKm), elevUp, elevDown, elevProfile };
    }

    // ─── Map Component ────────────────────────────────────────────────────────
    function RouteMap({ coords, color, mapId }) {
      const mapRef = useRef(null);
      const instanceRef = useRef(null);

      useEffect(() => {
        if (!coords || coords.length === 0) return;
        const container = document.getElementById(mapId);
        if (!container) return;

        if (instanceRef.current) {
          instanceRef.current.remove();
          instanceRef.current = null;
        }

        const map = L.map(container, { zoomControl: true, attributionControl: false });
        instanceRef.current = map;

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 19,
        }).addTo(map);

        const latLngs = coords.map(c => [c[1], c[0]]);
        const poly = L.polyline(latLngs, { color, weight: 4, opacity: 0.9 }).addTo(map);

        // Start/end markers
        const startIcon = L.divIcon({ html: '🟢', className: '', iconSize: [20, 20] });
        const endIcon = L.divIcon({ html: '🔴', className: '', iconSize: [20, 20] });
        L.marker(latLngs[0], { icon: startIcon }).addTo(map);

        map.fitBounds(poly.getBounds(), { padding: [20, 20] });

        return () => {
          if (instanceRef.current) {
            instanceRef.current.remove();
            instanceRef.current = null;
          }
        };
      }, [coords, color, mapId]);

      return <div id={mapId} className="route-map" />;
    }

    // ─── Elevation Chart ──────────────────────────────────────────────────────
    function ElevationChart({ data, color }) {
      return (
        <div style={{ height: 120 }}>
          <ResponsiveContainer width="100%" height="100%">
            <AreaChart data={data} margin={{ top: 5, right: 10, left: -20, bottom: 0 }}>
              <defs>
                <linearGradient id={`grad-${color.replace('#','')}`} x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%" stopColor={color} stopOpacity={0.4} />
                  <stop offset="95%" stopColor={color} stopOpacity={0.05} />
                </linearGradient>
              </defs>
              <XAxis dataKey="d" tick={{ fontSize: 10, fill: '#64748b' }} tickFormatter={v => `${v}km`} />
              <YAxis tick={{ fontSize: 10, fill: '#64748b' }} tickFormatter={v => `${v}m`} />
              <Tooltip
                contentStyle={{ background: '#1e293b', border: '1px solid #334155', borderRadius: 8, fontSize: 12 }}
                labelFormatter={v => `${v} km`}
                formatter={v => [`${Math.round(v)} m`, 'Höhe']}
              />
              <Area type="monotone" dataKey="ele" stroke={color} fill={`url(#grad-${color.replace('#','')})`} strokeWidth={2} dot={false} />
            </AreaChart>
          </ResponsiveContainer>
        </div>
      );
    }

    // ─── Route Card ───────────────────────────────────────────────────────────
    function RouteCard({ route, typeInfo, speedKmh, onSave, index }) {
      const [expanded, setExpanded] = useState(false);
      const [saveName, setSaveName] = useState('');
      const diff = calcDifficulty(route.distKm, route.elevUp);
      const duration = formatDuration(route.distKm, speedKmh);

      return (
        <div className={`route-card ${expanded ? 'selected' : ''}`}>
          <div className="route-card-header" onClick={() => setExpanded(e => !e)}>
            <div className="route-type-badge">
              <div className={`route-icon ${route.type}`}>
                <span>{typeInfo.icon}</span>
              </div>
              <div>
                <div className="route-name">{typeInfo.label}</div>
                <div className="route-tagline">{typeInfo.tagline}</div>
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span className={`difficulty-badge ${diff.cls}`}>{diff.label}</span>
              <span style={{ color: '#64748b', fontSize: 18 }}>{expanded ? '▲' : '▼'}</span>
            </div>
          </div>

          <div className="route-stats">
            <div className="stat-item">
              <div className="stat-icon">📏</div>
              <div className="stat-value">{route.distKm}</div>
              <div className="stat-label">km</div>
            </div>
            <div className="stat-item">
              <div className="stat-icon">⬆️</div>
              <div className="stat-value">{route.elevUp}</div>
              <div className="stat-label">m Aufstieg</div>
            </div>
            <div className="stat-item">
              <div className="stat-icon">⬇️</div>
              <div className="stat-value">{route.elevDown}</div>
              <div className="stat-label">m Abstieg</div>
            </div>
            <div className="stat-item">
              <div className="stat-icon">⏱️</div>
              <div className="stat-value" style={{ fontSize: 15 }}>{duration}</div>
              <div className="stat-label">Dauer</div>
            </div>
          </div>

          {expanded && (
            <>
              <div className="route-map-container">
                <RouteMap coords={route.coords} color={typeInfo.color} mapId={`map-${index}`} />
              </div>
              <div className="elevation-container">
                <div className="elevation-title">Höhenprofil</div>
                <ElevationChart data={route.elevProfile} color={typeInfo.color} />
              </div>
              <div className="route-actions">
                <input
                  className="save-input"
                  placeholder="Tourname eingeben…"
                  value={saveName}
                  onChange={e => setSaveName(e.target.value)}
                />
                <button
                  className="btn-secondary"
                  onClick={() => { if (saveName.trim()) { onSave(route, saveName.trim()); setSaveName(''); } }}
                >
                  💾 Speichern
                </button>
                <button
                  className="btn-secondary"
                  onClick={() => downloadGPX(saveName || typeInfo.label, route.coords)}
                >
                  ⬇️ GPX
                </button>
              </div>
            </>
          )}
        </div>
      );
    }

    // ─── Saved Tours ──────────────────────────────────────────────────────────
    function SavedTours({ tours, onDelete, speedKmh }) {
      if (!tours.length) {
        return (
          <div className="empty-state">
            <div className="empty-icon">🗺️</div>
            <div className="empty-title">Noch keine Touren gespeichert</div>
            <div className="empty-text">Plane eine Route und speichere sie hier.</div>
          </div>
        );
      }
      return (
        <div>
          {tours.map((tour, i) => {
            const diff = calcDifficulty(tour.route.distKm, tour.route.elevUp);
            const ti = ROUTE_TYPES.find(t => t.id === tour.route.type) || ROUTE_TYPES[0];
            return (
              <div key={i} className="saved-tour-item">
                <div>
                  <div className="saved-tour-name">{ti.icon} {tour.name}</div>
                  <div className="saved-tour-meta">
                    {tour.route.distKm} km · ↑{tour.route.elevUp}m ·{' '}
                    <span className={`difficulty-badge ${diff.cls}`} style={{ fontSize: 10, padding: '2px 7px' }}>{diff.label}</span>
                  </div>
                </div>
                <div className="saved-tour-actions">
                  <button className="btn-secondary" onClick={() => downloadGPX(tour.name, tour.route.coords)}>⬇️ GPX</button>
                  <button className="btn-danger" onClick={() => onDelete(i)}>🗑️</button>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ─── Profile Panel ────────────────────────────────────────────────────────
    function ProfilePanel({ profile, onChange }) {
      return (
        <div>
          <div className="profile-card">
            <div className="profile-avatar">🚴</div>
            <div className="form-group">
              <label>Name</label>
              <input
                type="text"
                value={profile.name}
                onChange={e => onChange({ ...profile, name: e.target.value })}
                placeholder="Dein Name"
              />
            </div>
            <div className="form-group">
              <label>Durchschnittsgeschwindigkeit</label>
              <input
                type="range" min="10" max="45" step="1"
                value={profile.speed}
                onChange={e => onChange({ ...profile, speed: parseFloat(e.target.value) })}
              />
              <div className="range-display">
                <span className="range-value">{profile.speed}</span>
                <span className="range-unit">km/h</span>
              </div>
            </div>
          </div>
          <div style={{ padding: '12px', background: '#1e293b', borderRadius: 12, border: '1px solid #334155', fontSize: 13, color: '#94a3b8', lineHeight: 1.6 }}>
            <strong style={{ color: '#f8fafc' }}>Hinweis: OpenRouteService API-Key</strong><br />
            Du benötigst einen kostenlosen API-Key von{' '}
            <a href="https://openrouteservice.org" target="_blank" style={{ color: '#60a5fa' }}>openrouteservice.org</a>{' '}
            (bis 2.000 Anfragen/Tag gratis). Trage ihn im Seitenbereich ein.
          </div>
        </div>
      );
    }

    // ─── Main App ─────────────────────────────────────────────────────────────
    function App() {
      const [apiKey, setApiKey] = useState('');
      const [startQuery, setStartQuery] = useState('');
      const [distKm, setDistKm] = useState(80);
      const [surfaces, setSurfaces] = useState(['asphalt']);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [routes, setRoutes] = useState([]);
      const [savedTours, setSavedTours] = useState([]);
      const [profile, setProfile] = useState({ name: 'Fahrer', speed: 25 });
      const [activeTab, setActiveTab] = useState('routes');

      const toggleSurface = (id) => {
        setSurfaces(prev =>
          prev.includes(id) ? prev.filter(s => s !== id) : [...prev, id]
        );
      };

      const planRoutes = async () => {
        if (!apiKey.trim()) { setError('Bitte trage deinen OpenRouteService API-Key ein.'); return; }
        if (!startQuery.trim()) { setError('Bitte gib einen Startpunkt ein.'); return; }
        if (!surfaces.length) { setError('Bitte wähle mindestens einen Belagstyp.'); return; }

        setLoading(true);
        setError('');
        setRoutes([]);

        try {
          const startCoord = await geocode(startQuery);
          const avoidSurfaces = SURFACE_OPTIONS.map(s => s.id).filter(s => !surfaces.includes(s));

          const results = await Promise.all(
            ROUTE_TYPES.map(async (type) => {
              const feature = await fetchRoute(apiKey, startCoord, distKm, type.elevationFactor, avoidSurfaces);
              return parseRoute(feature, type.id);
            })
          );

          setRoutes(results);
          setActiveTab('routes');
        } catch (e) {
          setError(e.message || 'Unbekannter Fehler bei der Routenplanung.');
        } finally {
          setLoading(false);
        }
      };

      const saveRoute = (route, name) => {
        setSavedTours(prev => [...prev, { name, route, savedAt: new Date().toISOString() }]);
      };

      const deleteTour = (index) => {
        setSavedTours(prev => prev.filter((_, i) => i !== index));
      };

      return (
        <div id="root" style={{ display: 'flex', minHeight: '100vh' }}>
          {/* ── Sidebar ── */}
          <aside className="sidebar">
            <div className="sidebar-header">
              <div className="app-title">
                <span style={{ fontSize: 28 }}>🚴</span>
                <div>
                  <div>Rennrad Planer</div>
                  <div className="app-subtitle">Touren für jeden Anspruch</div>
                </div>
              </div>
            </div>

            {/* API Key */}
            <div className="sidebar-section">
              <div className="section-title">🔑 API-Zugang</div>
              <div className="api-key-notice">
                Kostenloser Key bei <a href="https://openrouteservice.org" target="_blank">openrouteservice.org</a> — bis 2.000 Anfragen/Tag gratis.
              </div>
              <div className="form-group">
                <label>OpenRouteService API-Key</label>
                <input
                  type="text"
                  value={apiKey}
                  onChange={e => setApiKey(e.target.value)}
                  placeholder="5b3ce3…"
                />
              </div>
            </div>

            {/* Start & Distance */}
            <div className="sidebar-section">
              <div className="section-title">📍 Start & Distanz</div>
              <div className="form-group">
                <label>Startpunkt</label>
                <input
                  type="text"
                  value={startQuery}
                  onChange={e => setStartQuery(e.target.value)}
                  placeholder="z. B. München, Marienplatz"
                  onKeyDown={e => e.key === 'Enter' && planRoutes()}
                />
              </div>
              <div className="form-group">
                <label>Gewünschte Streckenlänge</label>
                <input
                  type="range" min="20" max="250" step="5"
                  value={distKm}
                  onChange={e => setDistKm(parseFloat(e.target.value))}
                />
                <div className="range-display">
                  <span className="range-value">{distKm}</span>
                  <span className="range-unit">km</span>
                </div>
              </div>
            </div>

            {/* Surface */}
            <div className="sidebar-section">
              <div className="section-title">🛤️ Erlaubte Belagsarten</div>
              <div className="surface-grid">
                {SURFACE_OPTIONS.map(s => (
                  <label key={s.id} className={`surface-chip ${surfaces.includes(s.id) ? 'active' : ''}`}>
                    <input type="checkbox" checked={surfaces.includes(s.id)} onChange={() => toggleSurface(s.id)} />
                    <span className="surface-icon">{s.icon}</span>
                    <span>{s.label}</span>
                  </label>
                ))}
              </div>
            </div>

            {/* Speed */}
            <div className="sidebar-section">
              <div className="section-title">⚡ Geschwindigkeit</div>
              <div className="form-group">
                <label>Ø Geschwindigkeit: <strong style={{ color: '#3b82f6' }}>{profile.speed} km/h</strong></label>
                <input
                  type="range" min="10" max="45" step="1"
                  value={profile.speed}
                  onChange={e => setProfile(p => ({ ...p, speed: parseFloat(e.target.value) }))}
                />
              </div>
            </div>

            {/* Plan button */}
            <div className="sidebar-section">
              <button className="btn-primary" onClick={planRoutes} disabled={loading}>
                {loading ? (
                  <><span style={{ display: 'inline-block', width: 16, height: 16, border: '2px solid rgba(255,255,255,0.3)', borderTop: '2px solid white', borderRadius: '50%', animation: 'spin 0.8s linear infinite' }}></span> Plane Routen…</>
                ) : (
                  <><span>🗺️</span> 3 Routen planen</>
                )}
              </button>
            </div>
          </aside>

          {/* ── Main ── */}
          <main className="main">
            <div className="tabs">
              <button className={`tab ${activeTab === 'routes' ? 'active' : ''}`} onClick={() => setActiveTab('routes')}>
                🗺️ Routen {routes.length > 0 && `(${routes.length})`}
              </button>
              <button className={`tab ${activeTab === 'saved' ? 'active' : ''}`} onClick={() => setActiveTab('saved')}>
                💾 Gespeichert {savedTours.length > 0 && `(${savedTours.length})`}
              </button>
              <button className={`tab ${activeTab === 'profile' ? 'active' : ''}`} onClick={() => setActiveTab('profile')}>
                👤 Profil
              </button>
            </div>

            {error && (
              <div className="error-box">
                <span style={{ fontSize: 20 }}>⚠️</span>
                <div>
                  <strong>Fehler:</strong> {error}
                  <br /><span style={{ fontSize: 12, opacity: 0.7 }}>Bitte prüfe API-Key, Startpunkt und Internetverbindung.</span>
                </div>
              </div>
            )}

            {activeTab === 'routes' && (
              <>
                {loading && (
                  <div className="spinner-overlay">
                    <div className="spinner"></div>
                    <div>Berechne 3 Routen über OpenRouteService…</div>
                    <div style={{ fontSize: 12, marginTop: 4 }}>Das kann einige Sekunden dauern</div>
                  </div>
                )}

                {!loading && routes.length === 0 && (
                  <div className="empty-state">
                    <div className="empty-icon">🚴‍♂️</div>
                    <div className="empty-title">Bereit für deine Tour?</div>
                    <div className="empty-text">
                      Gib links deinen Startpunkt ein, wähle die gewünschte Distanz<br />
                      und klicke auf „3 Routen planen".
                    </div>
                  </div>
                )}

                {!loading && routes.length > 0 && (
                  <div className="routes-grid">
                    {routes.map((route, i) => {
                      const ti = ROUTE_TYPES.find(t => t.id === route.type);
                      return (
                        <RouteCard
                          key={i}
                          route={route}
                          typeInfo={ti}
                          speedKmh={profile.speed}
                          onSave={saveRoute}
                          index={i}
                        />
                      );
                    })}
                  </div>
                )}
              </>
            )}

            {activeTab === 'saved' && (
              <SavedTours tours={savedTours} onDelete={deleteTour} speedKmh={profile.speed} />
            )}

            {activeTab === 'profile' && (
              <ProfilePanel profile={profile} onChange={setProfile} />
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
