<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rennrad Routenplaner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    #root { display: flex; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

    /* ── Sidebar ── */
    .sidebar { width: 340px; min-width: 340px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; overflow-y: auto; height: 100vh; position: sticky; top: 0; }
    .sidebar-header { padding: 24px 20px 16px; border-bottom: 1px solid #334155; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
    .app-title { font-size: 20px; font-weight: 700; color: #f8fafc; display: flex; align-items: center; gap: 10px; }
    .app-subtitle { font-size: 12px; color: #64748b; margin-top: 4px; }
    .sidebar-section { padding: 16px 20px; border-bottom: 1px solid #2d3f55; }
    .section-title { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    label { font-size: 13px; color: #94a3b8; margin-bottom: 4px; display: block; }
    input[type="text"] { width: 100%; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 8px 12px; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #3b82f6; }
    input[type="range"] { width: 100%; cursor: pointer; accent-color: #3b82f6; margin-top: 4px; }
    .range-display { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
    .range-value { font-size: 22px; font-weight: 700; color: #3b82f6; }
    .range-unit { font-size: 12px; color: #64748b; }

    /* ── Location autocomplete ── */
    .loc-wrap { position: relative; }
    .loc-hint { font-size: 11px; color: #475569; margin-top: 4px; }
    .loc-confirmed { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; margin-top: 5px; }
    .loc-confirmed-text { color: #86efac; flex: 1; line-height: 1.4; }
    .loc-clear { background: none; border: none; color: #64748b; cursor: pointer; font-size: 14px; padding: 0; line-height: 1; flex-shrink: 0; }
    .loc-clear:hover { color: #f87171; }
    .loc-dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #1e293b; border: 1px solid #334155; border-radius: 10px; z-index: 9999; max-height: 220px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .loc-item { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #334155; transition: background 0.15s; }
    .loc-item:last-child { border-bottom: none; }
    .loc-item:hover { background: #334155; }
    .loc-item-name { font-size: 13px; font-weight: 500; color: #e2e8f0; margin-bottom: 2px; }
    .loc-item-detail { font-size: 10px; color: #475569; }

    /* ── Surface chips ── */
    .surface-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .surface-chip { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #334155; border-radius: 8px; cursor: pointer; transition: all 0.2s; background: #0f172a; font-size: 13px; color: #94a3b8; user-select: none; }
    .surface-chip.active { border-color: #3b82f6; background: rgba(59,130,246,0.1); color: #93c5fd; }

    .api-key-notice { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #fcd34d; margin-bottom: 12px; line-height: 1.5; }
    .api-key-notice a { color: #fbbf24; }

    /* ── Buttons ── */
    .btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(59,130,246,0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-sm { padding: 6px 12px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 7px; font-size: 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .btn-sm:hover { background: #334155; color: #f8fafc; }
    .btn-sm.hi { background: rgba(59,130,246,0.15); border-color: #3b82f6; color: #93c5fd; }
    .btn-danger { padding: 5px 10px; background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.3); border-radius: 6px; font-size: 12px; cursor: pointer; }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }

    /* ── Main ── */
    .main { flex: 1; padding: 24px; overflow-y: auto; background: #0f172a; }
    .tabs { display: flex; gap: 2px; margin-bottom: 24px; background: #1e293b; padding: 4px; border-radius: 12px; border: 1px solid #334155; }
    .tab { flex: 1; padding: 8px 16px; background: transparent; border: none; color: #64748b; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 9px; transition: all 0.2s; }
    .tab.active { background: #3b82f6; color: white; }

    /* ── Spinners ── */
    .spinner-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; color: #64748b; }
    .spinner { width: 48px; height: 48px; border: 3px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-inline { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .spin-sm { display: inline-block; width: 11px; height: 11px; border: 2px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }

    .error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; padding: 14px 18px; color: #f87171; margin-bottom: 20px; display: flex; align-items: flex-start; gap: 10px; }

    /* ── Route cards ── */
    .routes-grid { display: grid; gap: 20px; }
    .route-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; overflow: hidden; transition: border-color 0.2s; }
    .route-card.selected { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    .route-card-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: linear-gradient(135deg, #1e293b 0%, #162032 100%); }
    .route-type-badge { display: flex; align-items: center; gap: 10px; }
    .route-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .route-icon.flat     { background: rgba(34,197,94,0.15); }
    .route-icon.hilly    { background: rgba(245,158,11,0.15); }
    .route-icon.mountain { background: rgba(239,68,68,0.15); }
    .route-name { font-size: 16px; font-weight: 600; color: #f8fafc; }
    .route-tagline { font-size: 12px; color: #64748b; margin-top: 2px; }
    .difficulty-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .diff-easy    { background: rgba(34,197,94,0.15);  color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .diff-medium  { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .diff-hard    { background: rgba(239,68,68,0.15);  color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .diff-extreme { background: rgba(168,85,247,0.15); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
    .route-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #334155; border-top: 1px solid #334155; }
    .stat-item { background: #0f172a; padding: 12px; text-align: center; }
    .stat-value { font-size: 18px; font-weight: 700; color: #f8fafc; }
    .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

    /* ── Edit toolbar ── */
    .edit-toolbar { padding: 10px 16px; border-top: 1px solid #334155; display: flex; gap: 8px; align-items: center; background: rgba(15,23,42,0.5); flex-wrap: wrap; }
    .edit-toolbar-label { font-size: 12px; color: #64748b; flex: 1; min-width: 100px; display: flex; align-items: center; gap: 6px; }

    /* ── Waypoint panel ── */
    .wp-panel { border-top: 1px solid #334155; background: #090f1a; }
    .wp-header { padding: 9px 16px; display: flex; align-items: center; gap: 8px; cursor: pointer; border-bottom: 1px solid #1e293b; user-select: none; }
    .wp-header:hover { background: rgba(255,255,255,0.02); }
    .wp-header-label { font-size: 12px; font-weight: 600; color: #94a3b8; flex: 1; }
    .wp-header-toggle { font-size: 11px; color: #475569; }
    .wp-body { }
    .wp-row { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-bottom: 1px solid #0f172a; min-height: 36px; }
    .wp-row.fixed { background: rgba(34,197,94,0.03); }
    .wp-badge { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .wp-badge.via { background: #f59e0b; color: #fff; }
    .wp-badge.start { background: rgba(34,197,94,0.2); font-size: 13px; }
    .wp-badge.end { background: rgba(239,68,68,0.2); font-size: 13px; }
    .wp-name { flex: 1; font-size: 12px; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .wp-name.fixed { color: #86efac; }
    .wp-actions { display: flex; gap: 3px; flex-shrink: 0; }
    .wp-btn { background: none; border: 1px solid #334155; color: #64748b; border-radius: 4px; width: 22px; height: 22px; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; padding: 0; }
    .wp-btn:hover:not(:disabled) { background: #334155; color: #f8fafc; }
    .wp-btn:disabled { opacity: 0.25; cursor: default; }
    .wp-btn.del { border-color: rgba(239,68,68,0.3); color: #f87171; background: rgba(239,68,68,0.07); }
    .wp-btn.del:hover { background: rgba(239,68,68,0.2); }
    .wp-search { padding: 8px 14px; border-top: 1px solid #1e293b; position: relative; }

    /* ── Map ── */
    .map-wrap { position: relative; }
    .route-map { height: 280px; background: #0a1628; }
    .route-map.edit { height: 300px; }
    .map-hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(9,15,26,0.92); color: #94a3b8; padding: 5px 14px; border-radius: 20px; font-size: 11px; z-index: 999; white-space: nowrap; border: 1px solid #334155; pointer-events: none; }
    .map-rerouting { position: absolute; top: 10px; right: 10px; background: rgba(9,15,26,0.92); color: #60a5fa; padding: 5px 12px; border-radius: 8px; font-size: 12px; z-index: 999; display: flex; align-items: center; gap: 6px; border: 1px solid #334155; }

    /* ── Route actions / elevation ── */
    .route-actions { padding: 12px 16px; border-top: 1px solid #334155; display: flex; gap: 8px; align-items: center; }
    .save-input { flex: 1; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 7px 12px; border-radius: 7px; font-size: 13px; outline: none; }
    .save-input:focus { border-color: #3b82f6; }
    .elevation-container { padding: 14px 16px; border-top: 1px solid #334155; }
    .elevation-title { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

    /* ── Saved cards ── */
    .saved-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; overflow: hidden; margin-bottom: 12px; transition: border-color 0.2s; }
    .saved-card.expanded { border-color: #3b82f6; }
    .saved-card-header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .saved-card-header:hover { background: rgba(255,255,255,0.02); }
    .saved-card-name { font-size: 14px; font-weight: 600; color: #f8fafc; }
    .saved-card-meta { font-size: 11px; color: #64748b; margin-top: 2px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .saved-card-btns { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }

    /* ── Profile ── */
    .profile-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .profile-avatar { width: 60px; height: 60px; background: linear-gradient(135deg, #3b82f6, #6366f1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 16px; }

    /* ── Empty ── */
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: 600; color: #64748b; margin-bottom: 8px; }
    .empty-text { font-size: 14px; color: #475569; line-height: 1.6; }

    @media (max-width: 768px) {
      #root { flex-direction: column; }
      .sidebar { width: 100%; min-width: unset; height: auto; position: relative; }
      .route-stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  const ORS_BASE       = 'https://api.openrouteservice.org/v2';
  const NOMINATIM_BASE = 'https://nominatim.openstreetmap.org';

  const SURFACE_OPTIONS = [
    { id: 'asphalt', label: 'Asphalt',  icon: '🛣️' },
    { id: 'gravel',  label: 'Schotter', icon: '🪨' },
    { id: 'pebble',  label: 'Kies',     icon: '⚪' },
    { id: 'dirt',    label: 'Feldweg',  icon: '🌿' },
  ];
  const ROUTE_TYPES = [
    { id: 'flat',     label: 'Flach',   icon: '🏁', tagline: 'Ideal für Tempo & Ausdauer',    color: '#22c55e', pref: 'fastest',     seed: 1 },
    { id: 'hilly',    label: 'Hügelig', icon: '⛰️', tagline: 'Abwechslungsreich & kraftvoll', color: '#f59e0b', pref: 'recommended', seed: 2 },
    { id: 'mountain', label: 'Bergig',  icon: '🏔️', tagline: 'Herausfordernd & spektakulär',  color: '#ef4444', pref: 'shortest',    seed: 3 },
  ];

  // ── Helpers ──────────────────────────────────────────────────────────────

  function calcDifficulty(distKm, elevM) {
    const s = distKm * 0.5 + elevM * 0.02;
    if (s < 30)  return { label: 'Leicht',  cls: 'diff-easy'    };
    if (s < 70)  return { label: 'Mittel',  cls: 'diff-medium'  };
    if (s < 130) return { label: 'Schwer',  cls: 'diff-hard'    };
    return               { label: 'Extrem', cls: 'diff-extreme' };
  }
  function formatDuration(distKm, speedKmh) {
    const h = distKm / speedKmh, hrs = Math.floor(h), mins = Math.round((h - hrs) * 60);
    return hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
  }
  function parseCoords(text) {
    const m = text.trim().match(/^(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)$/);
    if (!m) return null;
    const a = parseFloat(m[1]), b = parseFloat(m[2]);
    if (a >= -90 && a <= 90 && b >= -180 && b <= 180) return [b, a];
    return null;
  }
  function buildElevProfile(coords, distKm) {
    const step = Math.max(1, Math.floor(coords.length / 80));
    return coords.filter((_, i) => i % step === 0)
      .map((c, i) => ({ d: parseFloat((i * step / coords.length * distKm).toFixed(2)), ele: c[2] || 0 }));
  }
  function generateGPX(name, coords) {
    const pts = coords.map(([lon, lat, ele]) =>
      `    <trkpt lat="${lat.toFixed(6)}" lon="${lon.toFixed(6)}">${ele != null ? `<ele>${ele.toFixed(1)}</ele>` : ''}</trkpt>`
    ).join('\n');
    return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Rennrad Routenplaner" xmlns="http://www.topografix.com/GPX/1/1">\n  <metadata><name>${name}</name></metadata>\n  <trk><name>${name}</name><trkseg>\n${pts}\n  </trkseg></trk>\n</gpx>`;
  }
  function downloadGPX(name, coords) {
    const blob = new Blob([generateGPX(name, coords)], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = `${name.replace(/\s+/g, '_')}.gpx`; a.click(); URL.revokeObjectURL(url);
  }
  function shortAddress(item) {
    const a = item.address || {};
    return [a.road || a.pedestrian || a.path || a.suburb, a.city || a.town || a.village || a.county, a.country]
      .filter(Boolean).join(', ') || item.display_name;
  }

  // ── API ───────────────────────────────────────────────────────────────────

  async function orsPost(apiKey, body) {
    const res = await fetch(`${ORS_BASE}/directions/cycling-road/geojson`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': apiKey },
      body: JSON.stringify(body),
    });
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error?.message || `API-Fehler ${res.status}`); }
    return (await res.json()).features[0];
  }
  async function fetchRoundTrip(apiKey, startCoord, distKm, pref, seed) {
    return orsPost(apiKey, { coordinates: [startCoord], options: { round_trip: { length: distKm * 1000, points: 3, seed } }, elevation: true, instructions: false, preference: pref });
  }
  async function fetchViaRoute(apiKey, waypoints, pref) {
    return orsPost(apiKey, { coordinates: waypoints, elevation: true, instructions: false, preference: pref });
  }
  function parseFeature(feature, typeId) {
    const coords = feature.geometry.coordinates, s = feature.properties.summary;
    const distKm = parseFloat((s.distance / 1000).toFixed(1));
    return { type: typeId, coords, distKm, elevUp: Math.round(s.ascent || 0), elevDown: Math.round(s.descent || 0), elevProfile: buildElevProfile(coords, distKm) };
  }
  async function reverseGeocode(lon, lat) {
    try {
      const res = await fetch(`${NOMINATIM_BASE}/reverse?lat=${lat.toFixed(6)}&lon=${lon.toFixed(6)}&format=json&zoom=16`, { headers: { 'Accept-Language': 'de' } });
      const data = await res.json();
      if (data.error) return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
      const a = data.address || {};
      return [a.road || a.pedestrian || a.path || a.suburb, a.city || a.town || a.village || a.county].filter(Boolean).join(', ') || `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
    } catch { return `${lat.toFixed(4)}, ${lon.toFixed(4)}`; }
  }

  // ── LocationInput (sidebar start search) ─────────────────────────────────

  function LocationInput({ onConfirm }) {
    const [text, setText] = useState(''), [suggestions, setSuggestions] = useState([]);
    const [searching, setSearching] = useState(false), [confirmed, setConfirmed] = useState(null);
    const timerRef = useRef(null), wrapRef = useRef(null);
    useEffect(() => {
      const h = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setSuggestions([]); };
      document.addEventListener('mousedown', h); return () => document.removeEventListener('mousedown', h);
    }, []);
    const confirm = (label, coord) => { setText(label); setConfirmed({ label, coord }); setSuggestions([]); onConfirm(coord, label); };
    const clear = () => { setText(''); setConfirmed(null); setSuggestions([]); onConfirm(null, ''); };
    const handleChange = e => {
      const val = e.target.value; setText(val); setConfirmed(null); onConfirm(null, ''); setSuggestions([]);
      clearTimeout(timerRef.current);
      if (!val.trim()) return;
      const coord = parseCoords(val);
      if (coord) { confirm(`📍 ${parseFloat(coord[1].toFixed(5))}, ${parseFloat(coord[0].toFixed(5))}`, coord); return; }
      if (val.trim().length < 3) return;
      setSearching(true);
      timerRef.current = setTimeout(async () => {
        try { const res = await fetch(`${NOMINATIM_BASE}/search?q=${encodeURIComponent(val)}&format=json&limit=5&addressdetails=1`, { headers: { 'Accept-Language': 'de' } }); setSuggestions(await res.json()); } catch {}
        setSearching(false);
      }, 450);
    };
    return (
      <div className="loc-wrap" ref={wrapRef}>
        <input type="text" value={text} onChange={handleChange} placeholder="Ort, Adresse oder Koordinaten" style={confirmed ? { borderColor: '#22c55e' } : {}} autoComplete="off" />
        <div className="loc-hint">z. B. „Hamburg, Rathausmarkt" oder „53.55, 10.00"</div>
        {confirmed && <div className="loc-confirmed"><span style={{ color: '#4ade80' }}>✓</span><span className="loc-confirmed-text">{confirmed.label}</span><button className="loc-clear" onClick={clear}>✕</button></div>}
        {(suggestions.length > 0 || searching) && !confirmed && (
          <div className="loc-dropdown">
            {searching && <div style={{ padding: '10px 12px', fontSize: 12, color: '#64748b' }}>Suche…</div>}
            {suggestions.map((s, i) => (
              <div key={i} className="loc-item" onClick={() => confirm(shortAddress(s), [parseFloat(s.lon), parseFloat(s.lat)])}>
                <div className="loc-item-name">{shortAddress(s)}</div>
                <div className="loc-item-detail">{s.display_name}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // ── ViaSearch (one-shot search inside waypoint panel) ─────────────────────

  function ViaSearch({ onAdd }) {
    const [text, setText] = useState(''), [suggestions, setSuggestions] = useState([]), [searching, setSearching] = useState(false);
    const timerRef = useRef(null), wrapRef = useRef(null);
    useEffect(() => {
      const h = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setSuggestions([]); };
      document.addEventListener('mousedown', h); return () => document.removeEventListener('mousedown', h);
    }, []);
    const select = (name, coord) => { onAdd(coord, name); setText(''); setSuggestions([]); };
    const handleChange = e => {
      const val = e.target.value; setText(val); setSuggestions([]);
      clearTimeout(timerRef.current);
      if (!val.trim()) return;
      const coord = parseCoords(val);
      if (coord) { select(`${parseFloat(coord[1].toFixed(5))}, ${parseFloat(coord[0].toFixed(5))}`, coord); return; }
      if (val.trim().length < 3) return;
      setSearching(true);
      timerRef.current = setTimeout(async () => {
        try { const res = await fetch(`${NOMINATIM_BASE}/search?q=${encodeURIComponent(val)}&format=json&limit=4&addressdetails=1`, { headers: { 'Accept-Language': 'de' } }); setSuggestions(await res.json()); } catch {}
        setSearching(false);
      }, 450);
    };
    return (
      <div ref={wrapRef} style={{ position: 'relative' }}>
        <input
          type="text" value={text} onChange={handleChange}
          placeholder="➕  Ort suchen oder Koordinaten eingeben…"
          autoComplete="off"
          style={{ width: '100%', background: '#0f172a', border: '1px solid #334155', color: '#f8fafc', padding: '7px 10px', borderRadius: 7, fontSize: 12, outline: 'none' }}
          onFocus={e => e.target.style.borderColor = '#3b82f6'}
          onBlur={e => e.target.style.borderColor = '#334155'}
        />
        {(suggestions.length > 0 || searching) && (
          <div style={{ position: 'absolute', top: 'calc(100% + 4px)', left: 0, right: 0, background: '#1e293b', border: '1px solid #334155', borderRadius: 8, zIndex: 9999, maxHeight: 200, overflowY: 'auto', boxShadow: '0 8px 24px rgba(0,0,0,0.5)' }}>
            {searching && <div style={{ padding: '8px 12px', fontSize: 11, color: '#64748b' }}>Suche…</div>}
            {suggestions.map((s, i) => (
              <div key={i} style={{ padding: '8px 12px', cursor: 'pointer', borderBottom: '1px solid #334155', transition: 'background 0.1s' }}
                onMouseEnter={e => e.currentTarget.style.background = '#334155'}
                onMouseLeave={e => e.currentTarget.style.background = ''}
                onClick={() => select(shortAddress(s), [parseFloat(s.lon), parseFloat(s.lat)])}
              >
                <div style={{ fontSize: 12, fontWeight: 500, color: '#e2e8f0' }}>{shortAddress(s)}</div>
                <div style={{ fontSize: 10, color: '#475569', marginTop: 1 }}>{s.display_name}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // ── WaypointPanel ─────────────────────────────────────────────────────────

  function WaypointPanel({ viaPoints, startName, onAdd, onRemove, onReorder }) {
    const [collapsed, setCollapsed] = useState(false);
    return (
      <div className="wp-panel">
        <div className="wp-header" onClick={() => setCollapsed(c => !c)}>

  // ── ElevationChart (pure SVG) ─────────────────────────────────────────────

  function ElevationChart({ data, color }) {
    if (!data || data.length < 2) return null;
    const W = 560, H = 100, pad = { top: 6, right: 6, bottom: 20, left: 36 };
    const cW = W - pad.left - pad.right, cH = H - pad.top - pad.bottom;
    const eles = data.map(d => d.ele), minE = Math.min(...eles), maxE = Math.max(...eles), rangeE = maxE - minE || 1;
    const maxD = data[data.length - 1].d || 1;
    const x = d => pad.left + (d / maxD) * cW;
    const y = e => pad.top  + (1 - (e - minE) / rangeE) * cH;
    const pts  = data.map(d => `${x(d.d).toFixed(1)},${y(d.ele).toFixed(1)}`).join(' ');
    const area = `${x(0).toFixed(1)},${(pad.top+cH).toFixed(1)} ${pts} ${x(maxD).toFixed(1)},${(pad.top+cH).toFixed(1)}`;
    const gid  = `eg${color.replace('#','')}`;
    return (
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: H, display: 'block' }}>
        <defs>
          <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stopColor={color} stopOpacity="0.45" />
            <stop offset="100%" stopColor={color} stopOpacity="0.04" />
          </linearGradient>
        </defs>
        <polygon points={area} fill={`url(#${gid})`} />
        <polyline points={pts} fill="none" stroke={color} strokeWidth="1.8" strokeLinejoin="round" />
        {[minE, minE + rangeE * 0.5, maxE].map(v => <text key={v} x={pad.left-3} y={y(v)+3.5} textAnchor="end" fontSize="9" fill="#64748b">{Math.round(v)}m</text>)}
        {[0, maxD*0.5, maxD].map((v,i) => <text key={i} x={x(v)} y={H-3} textAnchor="middle" fontSize="9" fill="#64748b">{v.toFixed(1)}km</text>)}
        <line x1={pad.left} y1={pad.top} x2={pad.left} y2={pad.top+cH} stroke="#1e293b" strokeWidth="1" />
        <line x1={pad.left} y1={pad.top+cH} x2={pad.left+cW} y2={pad.top+cH} stroke="#1e293b" strokeWidth="1" />
      </svg>
    );
  }

  // ── RouteMap (Leaflet) ────────────────────────────────────────────────────

  function RouteMap({ coords, color, mapId, editMode, viaCoords, onAddVia, onMoveVia, rerouting }) {
    const mapRef        = useRef(null);
    const polyRef       = useRef(null);
    const startMkRef    = useRef(null);
    const viaMkRef      = useRef([]);
    const editRef       = useRef(editMode);
    const addRef        = useRef(onAddVia);
    useEffect(() => { editRef.current = editMode; }, [editMode]);
    useEffect(() => { addRef.current  = onAddVia;  }, [onAddVia]);

    // Init map once
    useEffect(() => {
      const container = document.getElementById(mapId);
      if (!container) return;
      if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
      const map = L.map(container, { zoomControl: true, attributionControl: false });
      mapRef.current = map;
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
      map.on('click', e => { if (editRef.current) addRef.current([e.latlng.lng, e.latlng.lat]); });
      return () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
    }, [mapId]);

    // Update polyline
    useEffect(() => {
      if (!mapRef.current || !coords || !coords.length) return;
      if (polyRef.current)    { polyRef.current.remove();    polyRef.current = null; }
      if (startMkRef.current) { startMkRef.current.remove(); startMkRef.current = null; }
      const ll = coords.map(c => [c[1], c[0]]);
      polyRef.current    = L.polyline(ll, { color, weight: 4, opacity: 0.9 }).addTo(mapRef.current);
      startMkRef.current = L.marker(ll[0], { icon: L.divIcon({ html: '🟢', className: '', iconSize: [20,20] }) }).addTo(mapRef.current);
      mapRef.current.fitBounds(polyRef.current.getBounds(), { padding: [24,24] });
    }, [coords, color]);

    // Edit mode cursor + zoom
    useEffect(() => {
      if (!mapRef.current) return;
      mapRef.current.getContainer().style.cursor = editMode ? 'crosshair' : '';
      if (editMode) mapRef.current.doubleClickZoom.disable();
      else          mapRef.current.doubleClickZoom.enable();
    }, [editMode]);

    // Via markers — draggable, numbered, no dblclick-delete (handled in list)
    useEffect(() => {
      if (!mapRef.current) return;
      viaMkRef.current.forEach(m => m.remove());
      viaMkRef.current = [];
      if (!editMode || !viaCoords.length) return;
      viaCoords.forEach((vp, i) => {
        const icon = L.divIcon({
          html: `<div style="background:#f59e0b;color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.5);cursor:grab">${i+1}</div>`,
          className: '', iconSize: [26,26], iconAnchor: [13,13],
        });
        const mk = L.marker([vp[1], vp[0]], { draggable: true, icon }).addTo(mapRef.current);
        mk.on('dragend', e => {
          const { lat, lng } = e.target.getLatLng();
          onMoveVia(i, [lng, lat]);
        });
        viaMkRef.current.push(mk);
      });
    }, [viaCoords, editMode, onMoveVia]);

    return (
      <div className="map-wrap">
        <div id={mapId} className={`route-map${editMode ? ' edit' : ''}`} />
        {editMode && <div className="map-hint">📍 Klick = Wegpunkt hinzufügen &nbsp;·&nbsp; Marker ziehen = verschieben</div>}
        {rerouting && <div className="map-rerouting"><span className="spin-sm" /> Neu berechnen…</div>}
      </div>
    );
  }

  // ── RouteCard ─────────────────────────────────────────────────────────────

  function RouteCard({ initialRoute, typeInfo, speedKmh, onSave, index, apiKey, startLabel }) {
    const [expanded,   setExpanded]   = useState(false);
    const [editMode,   setEditMode]   = useState(false);
    const [viaPoints,  setViaPoints]  = useState([]); // [{coord:[lon,lat], name:string}]
    const [route,      setRoute]      = useState(initialRoute);
    const [rerouting,  setRerouting]  = useState(false);
    const [rerouteErr, setRerouteErr] = useState('');
    const [saveName,   setSaveName]   = useState('');
    const [startName,  setStartName]  = useState(startLabel || '');
    const viaRef = useRef([]);

    const diff     = calcDifficulty(route.distKm, route.elevUp);
    const duration = formatDuration(route.distKm, speedKmh);
    const startCoord = initialRoute.coords[0].slice(0, 2);

    // Resolve start name once when entering edit mode
    useEffect(() => {
      if (editMode && !startName) {
        reverseGeocode(startCoord[0], startCoord[1]).then(setStartName);
      }
    }, [editMode]);

    const rerouteWith = useCallback(async (coords) => {
      setRerouting(true); setRerouteErr('');
      try {
        const feature = coords.length === 0
          ? await fetchRoundTrip(apiKey, startCoord, initialRoute.distKm, typeInfo.pref, typeInfo.seed)
          : await fetchViaRoute(apiKey, [startCoord, ...coords, startCoord], typeInfo.pref);
        setRoute(parseFeature(feature, initialRoute.type));
      } catch (e) { setRerouteErr(e.message); }
      finally { setRerouting(false); }
    }, [apiKey, startCoord, initialRoute, typeInfo]);

    const updateVia = useCallback((newVia) => {
      viaRef.current = newVia; setViaPoints(newVia);
      rerouteWith(newVia.map(v => v.coord));
    }, [rerouteWith]);

    const handleAddVia = useCallback(async (coord, nameOverride) => {
      const name = nameOverride || await reverseGeocode(coord[0], coord[1]);
      updateVia([...viaRef.current, { coord, name }]);
    }, [updateVia]);

    const handleMoveVia = useCallback((i, coord) => {
      const nv = [...viaRef.current]; nv[i] = { ...nv[i], coord };
      // Update name async but don't await (keep existing name until resolved)
      reverseGeocode(coord[0], coord[1]).then(name => {
        const latest = [...viaRef.current]; if (latest[i]) { latest[i] = { ...latest[i], name }; viaRef.current = latest; setViaPoints([...latest]); }
      });
      updateVia(nv);
    }, [updateVia]);

    const handleRemoveVia = useCallback(i => updateVia(viaRef.current.filter((_, j) => j !== i)), [updateVia]);

    const handleReorder = useCallback((from, to) => {
      if (to < 0 || to >= viaRef.current.length) return;
      const nv = [...viaRef.current]; [nv[from], nv[to]] = [nv[to], nv[from]]; updateVia(nv);
    }, [updateVia]);

    const resetEdit = () => { viaRef.current = []; setViaPoints([]); setRoute(initialRoute); setEditMode(false); setRerouteErr(''); };

    const viaCoords = viaPoints.map(v => v.coord);

    return (
      <div className={`route-card ${expanded ? 'selected' : ''}`}>
        {/* Header */}
        <div className="route-card-header" onClick={() => !editMode && setExpanded(e => !e)}>
          <div className="route-type-badge">
            <div className={`route-icon ${route.type}`}>{typeInfo.icon}</div>
            <div><div className="route-name">{typeInfo.label}</div><div className="route-tagline">{typeInfo.tagline}</div></div>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <span className={`difficulty-badge ${diff.cls}`}>{diff.label}</span>
            <span style={{ color:'#64748b', fontSize:16 }}>{expanded ? '▲' : '▼'}</span>
          </div>
        </div>

        {/* Stats */}
        <div className="route-stats">
          {[
            { icon:'📏', value: route.distKm,  label:'km'         },
            { icon:'⬆️', value: route.elevUp,   label:'m Aufstieg' },
            { icon:'⬇️', value: route.elevDown, label:'m Abstieg'  },
            { icon:'⏱️', value: duration,        label:'Dauer', sm: true },
          ].map(({icon,value,label,sm}) => (
            <div key={label} className="stat-item">
              <div style={{ fontSize:14, marginBottom:2 }}>{icon}</div>
              <div className="stat-value" style={sm ? {fontSize:15} : {}}>{value}</div>
              <div className="stat-label">{label}</div>
            </div>
          ))}
        </div>

        {expanded && (
          <>
            {/* Edit toolbar */}
            <div className="edit-toolbar">
              {!editMode ? (
                <button className="btn-sm" onClick={() => setEditMode(true)}>✏️ Route manuell anpassen</button>
              ) : (
                <>
                  <div className="edit-toolbar-label">
                    {rerouting ? <><span className="spin-sm" /> Neu berechnen…</> : `${viaPoints.length} Wegpunkt${viaPoints.length !== 1 ? 'e' : ''}`}
                  </div>
                  <button className="btn-sm" onClick={resetEdit}>↩️ Zurücksetzen</button>
                  <button className="btn-sm hi" onClick={() => setEditMode(false)}>✅ Fertig</button>
                </>
              )}
            </div>
            {rerouteErr && <div style={{ padding:'6px 16px', color:'#f87171', fontSize:12 }}>⚠️ {rerouteErr}</div>}

            {/* Waypoint list (only in edit mode) */}
            {editMode && (
              <WaypointPanel
                viaPoints={viaPoints}
                startName={startName}
                onAdd={handleAddVia}
                onRemove={handleRemoveVia}
                onReorder={handleReorder}
              />
            )}

            {/* Map */}
            <RouteMap
              coords={route.coords} color={typeInfo.color} mapId={`map-${index}`}
              editMode={editMode} viaCoords={viaCoords} rerouting={rerouting}
              onAddVia={handleAddVia} onMoveVia={handleMoveVia}
            />

            {/* Elevation */}
            <div className="elevation-container">
              <div className="elevation-title">Höhenprofil</div>
              <ElevationChart data={route.elevProfile} color={typeInfo.color} />
            </div>

            {/* Save / GPX */}
            <div className="route-actions">
              <input className="save-input" placeholder="Tourname…" value={saveName} onChange={e => setSaveName(e.target.value)} />
              <button className="btn-sm" onClick={() => { if (saveName.trim()) { onSave(route, saveName.trim()); setSaveName(''); } }}>💾 Speichern</button>
              <button className="btn-sm" onClick={() => downloadGPX(saveName || typeInfo.label, route.coords)}>⬇️ GPX</button>
            </div>
          </>
        )}
      </div>
    );
  }

  // ── SavedRouteCard ────────────────────────────────────────────────────────

              <span>↑{tour.route.elevUp}m</span><span>·</span>

            <button className="btn-danger" onClick={() => onDelete(index)}>🗑️</button>
          </div>
          <span style={{ color:'#64748b', fontSize:13, marginLeft:6 }}>{expanded ? '▲' : '▼'}</span>
        </div>
        {expanded && (
          <>
            <RouteMap coords={tour.route.coords} color={ti.color} mapId={`saved-map-${index}`}
              editMode={false} viaCoords={[]} rerouting={false} onAddVia={() => {}} onMoveVia={() => {}} />
            <div className="elevation-container">
              <div className="elevation-title">Höhenprofil</div>
              <ElevationChart data={tour.route.elevProfile} color={ti.color} />
            </div>
            <div className="route-actions">
              <button className="btn-sm" style={{ marginLeft:'auto' }} onClick={() => downloadGPX(tour.name, tour.route.coords)}>⬇️ GPX herunterladen</button>
            </div>
          </>
        )}
      </div>
    );
  }

  // ── ProfilePanel ──────────────────────────────────────────────────────────

  function ProfilePanel({ profile, onChange }) {

      <div>
        <div className="profile-card">
          <div className="profile-avatar">🚴</div>
          <div className="form-group">
            <label>Name</label>

  // ── App ───────────────────────────────────────────────────────────────────

  function App() {
    const [apiKey,     setApiKey]     = useState('');
    const [startCoord, setStartCoord] = useState(null);
    const [startLabel, setStartLabel] = useState('');
    const [distKm,     setDistKm]     = useState(80);
    const [surfaces,   setSurfaces]   = useState(['asphalt']);
    const [loading,    setLoading]    = useState(false);
    const [error,      setError]      = useState('');
    const [routes,     setRoutes]     = useState([]);
    const [savedTours, setSavedTours] = useState([]);
    const [profile,    setProfile]    = useState({ name: 'Fahrer', speed: 25 });
    const [activeTab,  setActiveTab]  = useState('routes');

    const planRoutes = async () => {
      if (!apiKey.trim())   { setError('Bitte trage deinen OpenRouteService API-Key ein.'); return; }
      if (!startCoord)      { setError('Bitte wähle einen gültigen Startpunkt aus der Liste.'); return; }
      if (!surfaces.length) { setError('Bitte wähle mindestens einen Belagstyp.'); return; }
      setLoading(true); setError(''); setRoutes([]);
      try {
        const results = await Promise.all(ROUTE_TYPES.map(async type => {
          const feature = await fetchRoundTrip(apiKey, startCoord, distKm, type.pref, type.seed);
          return parseFeature(feature, type.id);
        }));
        setRoutes(results); setActiveTab('routes');
      } catch (e) { setError(e.message || 'Unbekannter Fehler.'); }
      finally { setLoading(false); }
    };

    return (
      <>
        <aside className="sidebar">
          <div className="sidebar-header">
            <div className="app-title"><span style={{ fontSize:28 }}>🚴</span><div><div>Rennrad Planer</div><div className="app-subtitle">Rundtouren für jeden Anspruch</div></div></div>
          </div>
          <div className="sidebar-section">
            <div className="section-title">🔑 API-Zugang</div>
            <div className="api-key-notice">Kostenloser Key bei <a href="https://openrouteservice.org" target="_blank" rel="noreferrer">openrouteservice.org</a> — 2.000 Anfragen/Tag gratis.</div>
            <div className="form-group"><label>OpenRouteService API-Key</label><input type="text" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="5b3ce3…" /></div>
          </div>
          <div className="sidebar-section">
            <div className="section-title">📍 Startpunkt & Distanz</div>
            <div className="form-group">
              <label>Startpunkt (Rundtour)</label>
              <LocationInput onConfirm={(coord, label) => { setStartCoord(coord); setStartLabel(label || ''); }} />
            </div>
            <div className="form-group">
              <label>Streckenlänge</label>
              <input type="range" min="20" max="250" step="5" value={distKm} onChange={e => setDistKm(+e.target.value)} />
              <div className="range-display"><span className="range-value">{distKm}</span><span className="range-unit">km</span></div>
            </div>
          </div>
          <div className="sidebar-section">
            <div className="section-title">🛤️ Belagsarten</div>
            <div className="surface-grid">
              {SURFACE_OPTIONS.map(s => (
                <label key={s.id} className={`surface-chip ${surfaces.includes(s.id) ? 'active' : ''}`}>
                  <input type="checkbox" checked={surfaces.includes(s.id)} onChange={() => setSurfaces(prev => prev.includes(s.id) ? prev.filter(x => x !== s.id) : [...prev, s.id])} style={{ display:'none' }} />
                  <span>{s.icon}</span><span>{s.label}</span>
                </label>
              ))}
            </div>
          </div>
          <div className="sidebar-section">
            <div className="section-title">⚡ Geschwindigkeit</div>
            <div className="form-group">
              <label>Ø <strong style={{ color:'#3b82f6' }}>{profile.speed} km/h</strong></label>
              <input type="range" min="10" max="45" step="1" value={profile.speed} onChange={e => setProfile(p => ({ ...p, speed: +e.target.value }))} />
            </div>
          </div>
          <div className="sidebar-section">
            <button className="btn-primary" onClick={planRoutes} disabled={loading}>
              {loading ? <><span className="spin-inline" /> Plane Routen…</> : <><span>🔄</span> 3 Rundtouren planen</>}
            </button>
          </div>
        </aside>

        <main className="main">
          <div className="tabs">
            <button className={`tab ${activeTab==='routes'  ? 'active':''}`} onClick={() => setActiveTab('routes')}>🗺️ Routen{routes.length > 0 ? ` (${routes.length})` : ''}</button>
            <button className={`tab ${activeTab==='saved'   ? 'active':''}`} onClick={() => setActiveTab('saved')}>💾 Gespeichert{savedTours.length > 0 ? ` (${savedTours.length})` : ''}</button>
            <button className={`tab ${activeTab==='profile' ? 'active':''}`} onClick={() => setActiveTab('profile')}>👤 Profil</button>
          </div>

          {error && <div className="error-box"><span style={{ fontSize:20, flexShrink:0 }}>⚠️</span><div><strong>Fehler:</strong> {error}<br /><span style={{ fontSize:12, opacity:0.7 }}>Prüfe API-Key, Startpunkt und Internetverbindung.</span></div></div>}

          {activeTab === 'routes' && (
            <>
              {loading && <div className="spinner-overlay"><div className="spinner" /><div>Berechne 3 Rundtouren…</div><div style={{ fontSize:12, marginTop:4 }}>Das kann einige Sekunden dauern</div></div>}
              {!loading && routes.length === 0 && (
                <div className="empty-state">
                  <div className="empty-icon">🔄</div>
                  <div className="empty-title">Bereit für deine Rundtour?</div>
                  <div className="empty-text">Wähle Startpunkt und Distanz,<br />dann „3 Rundtouren planen".</div>
                </div>
              )}
              {!loading && routes.length > 0 && (
                <div className="routes-grid">
                  {routes.map((route, i) => (
                    <RouteCard key={i} index={i} initialRoute={route} apiKey={apiKey} startLabel={startLabel}
                      typeInfo={ROUTE_TYPES.find(t => t.id === route.type)} speedKmh={profile.speed}
                      onSave={(r, name) => setSavedTours(prev => [...prev, { name, route: r }])} />
                  ))}
                </div>
              )}
            </>
          )}

          {activeTab === 'saved' && (
            savedTours.length === 0
              ? <div className="empty-state"><div className="empty-icon">🗺️</div><div className="empty-title">Noch keine Touren gespeichert</div><div className="empty-text">Plane eine Route und speichere sie hier.</div></div>
              : <div>{savedTours.map((tour, i) => <SavedRouteCard key={i} tour={tour} index={i} onDelete={j => setSavedTours(prev => prev.filter((_,k) => k !== j))} />)}</div>
          )}

          {activeTab === 'profile' && <ProfilePanel profile={profile} onChange={setProfile} />}
        </main>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
