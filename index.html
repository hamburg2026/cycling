  // ── Trainer: Progress Curve Chart ────────────────────────────────────────
  function ProgressCurveChart({plan,logs}){
    const today=localISO(new Date());
    const curWeekIdx=plan.weeks.findIndex(w=>{const d0=w.sessions[0]?.date,d6=w.sessions[6]?.date;return today>=d0&&today<=d6;});
    // compute per-week plan and actual km
    const weekData=plan.weeks.map((w,wi)=>{
      const planKm=w.weekKm||0;
      const isPast=wi<curWeekIdx;
      const isCurrent=wi===curWeekIdx;
      let actualKm=null;
      if(isPast||isCurrent){
        actualKm=w.sessions.reduce((sum,sess)=>{
          const lg=logs[sess.id];
          if(lg&&!lg.skipped)return sum+(parseFloat(lg.distanceKm)||0);
          return sum;
        },0);
      }
      return{planKm,actualKm,isPast,isCurrent};
    });
    // cumulative arrays
    let cumPlan=0,cumActual=0;
    const series=weekData.map((d,i)=>{
      cumPlan+=d.planKm;
      const hasActual=d.actualKm!==null;
      if(hasActual)cumActual+=d.actualKm;
      return{plan:cumPlan,actual:hasActual?cumActual:null,hasActual};
    });
    const doneWeeks=series.filter(s=>s.hasActual);
    if(doneWeeks.length===0)return null;
    // trend analysis
    const lastDelta=doneWeeks[doneWeeks.length-1].actual-doneWeeks[doneWeeks.length-1].plan;
    const last4=doneWeeks.slice(-4).map(s=>s.actual-s.plan);
    const last2=doneWeeks.slice(-2).map(s=>s.actual-s.plan);
    const avg4=last4.reduce((a,b)=>a+b,0)/Math.max(1,last4.length);
    const avg2=last2.reduce((a,b)=>a+b,0)/Math.max(1,last2.length);
    const trendImproving=lastDelta>=0?(avg2>=avg4):(avg2>avg4);
    let trendLabel='',trendColor='#64748b';
    const absDelta=Math.abs(Math.round(lastDelta));
    if(lastDelta>=0&&trendImproving){trendLabel=`📈 +${absDelta} km über Plan`;trendColor='#22c55e';}
    else if(lastDelta>=0&&!trendImproving){trendLabel=`📊 +${absDelta} km über Plan (Tendenz: nachlassend)`;trendColor='#f59e0b';}
    else if(lastDelta<0&&trendImproving){trendLabel=`📉 ${absDelta} km unter Plan (Tendenz: aufholend)`;trendColor='#f59e0b';}
    else{trendLabel=`⚠️ ${absDelta} km unter Plan`;trendColor='#ef4444';}
    // SVG layout — VH increased to 220 to accommodate phase strip
    const VW=580,VH=220,PL=46,PT=14,PB=46,PR=14;
    const PHASE_STRIP_H=10;
    const cW=VW-PL-PR,cH=VH-PT-PB;
    const n=series.length;
    const allPlan=series.map(s=>s.plan);
    const allActual=series.filter(s=>s.hasActual).map(s=>s.actual);
    const maxY=Math.max(...allPlan,...allActual,10);
    const xOf=i=>PL+i/(Math.max(n-1,1))*cW;
    const yOf=v=>PT+cH-(v/maxY)*cH;
    // Phase strip y position: above x-axis labels
    const PHASE_STRIP_Y=VH-PB+16;
    // build plan line points
    const planPts=series.map((s,i)=>`${xOf(i).toFixed(1)},${yOf(s.plan).toFixed(1)}`).join(' ');
    // plan corridor polygon (±10%)
    const corridorTop=series.map((s,i)=>`${xOf(i).toFixed(1)},${yOf(s.plan*1.1).toFixed(1)}`).join(' ');
    const corridorBot=[...series].reverse().map((s,i)=>`${xOf(n-1-i).toFixed(1)},${yOf(s.plan*0.9).toFixed(1)}`).join(' ');
    const corridorPoly=corridorTop+' '+corridorBot;
    // actual line for done portion
    const doneCount=series.filter(s=>s.hasActual).length;
    const actualPts=series.slice(0,doneCount).map((s,i)=>`${xOf(i).toFixed(1)},${yOf(s.actual).toFixed(1)}`).join(' ');
    // fill between plan and actual
    const lastDoneIdx=doneCount-1;
    const fillPts=lastDoneIdx>=0?(
      series.slice(0,doneCount).map((s,i)=>`${xOf(i).toFixed(1)},${yOf(s.plan).toFixed(1)}`).join(' ')+' '+
      [...series.slice(0,doneCount)].reverse().map((s,i)=>`${xOf(doneCount-1-i).toFixed(1)},${yOf(s.actual).toFixed(1)}`).join(' ')
    ):'';
    const fillColor=lastDelta>=0?'#22c55e':'#ef4444';
    // current position dot
    const curIdx=curWeekIdx>=0?curWeekIdx:doneCount-1;
    const curDot=series[curIdx]&&series[curIdx].hasActual?{x:xOf(curIdx),y:yOf(series[curIdx].actual)}:null;
    // x-axis labels (max ~10) — moved down 16px to sit below phase strip
    const labelStep=n<=10?1:n<=20?2:Math.ceil(n/10);
    // grid km levels
    const gridKms=[0,0.25,0.5,0.75,1].map(f=>Math.round(maxY*f));
    // Compute phase segments for embedded phase strip
    const phaseSegs=[];
    let curPh=null;
    plan.weeks.forEach((w,wi)=>{
      if(!curPh||curPh.phase!==w.phase){if(curPh)phaseSegs.push(curPh);curPh={phase:w.phase,start:wi,count:1};}
      else curPh.count++;
    });
    if(curPh)phaseSegs.push(curPh);
    const halfCol=n>1?cW/(2*(n-1)):cW/2;
    return(
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6,flexWrap:'wrap'}}>
          <span style={{fontSize:12,fontWeight:600,color:'#f8fafc'}}>Kumulierter Fortschritt</span>
          <span style={{fontSize:11,fontWeight:600,color:trendColor,background:`${trendColor}18`,border:`1px solid ${trendColor}40`,borderRadius:6,padding:'2px 8px'}}>{trendLabel}</span>
        </div>
        <svg viewBox={`0 0 ${VW} ${VH}`} style={{width:'100%',height:VH,display:'block'}}>
          {/* grid lines */}
          {gridKms.map(km=>(
            <React.Fragment key={km}>
              <line x1={PL} y1={yOf(km)} x2={PL+cW} y2={yOf(km)} stroke="#1a2942" strokeWidth={km===0?1.5:0.8}/>
              <text x={PL-4} y={yOf(km)+3.5} textAnchor="end" fontSize={9} fill="#475569">{km}</text>
            </React.Fragment>
          ))}
          {/* plan corridor */}
          {n>1&&<polygon points={corridorPoly} fill="#334155" fillOpacity={0.2}/>}
          {/* fill between plan and actual */}
          {fillPts&&doneCount>1&&<polygon points={fillPts} fill={fillColor} fillOpacity={0.18}/>}
          {/* plan line (dashed) */}
          {n>1&&<polyline points={planPts} fill="none" stroke="#64748b" strokeWidth={1.5} strokeDasharray="5 3"/>}
          {/* actual line */}
          {doneCount>1&&<polyline points={actualPts} fill="none" stroke={fillColor} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>}
          {/* vertical line at current week — extends through phase strip */}
          {curWeekIdx>=0&&(
            <line x1={xOf(curWeekIdx)} y1={PT} x2={xOf(curWeekIdx)} y2={PHASE_STRIP_Y+PHASE_STRIP_H} stroke="#3b82f6" strokeWidth={1} strokeDasharray="3 2" opacity={0.6}/>
          )}
          {/* current position dot */}
          {curDot&&(
            <React.Fragment>
              <circle cx={curDot.x} cy={curDot.y} r={7} fill={fillColor} fillOpacity={0.25}/>
              <circle cx={curDot.x} cy={curDot.y} r={4} fill={fillColor}/>
            </React.Fragment>
          )}
          {/* Phase strip embedded in SVG */}
          {phaseSegs.map((ph,i)=>{
            const x0=xOf(ph.start)-(ph.start===0?halfCol:halfCol);
            const x1=xOf(ph.start+ph.count-1)+(ph.start+ph.count===n?halfCol:halfCol);
            const meta=PHASE_META[ph.phase];
            const isPast=ph.start+ph.count<=curWeekIdx;
            const isCur=ph.start<=curWeekIdx&&curWeekIdx<ph.start+ph.count;
            const opacity=isPast?0.35:isCur?1:0.22;
            return(
              <React.Fragment key={i}>
                <rect x={x0} y={PHASE_STRIP_Y} width={x1-x0} height={PHASE_STRIP_H}
                  fill={meta.color} fillOpacity={opacity} rx={2}/>
                {isCur&&(
                  <text x={(x0+x1)/2} y={PHASE_STRIP_Y+PHASE_STRIP_H-1} textAnchor="middle" fontSize={7} fill={meta.color} fontWeight={700}>{meta.label}</text>
                )}
              </React.Fragment>
            );
          })}
          {/* x-axis week labels below phase strip */}
          {series.map((s,i)=>{
            if(i%labelStep!==0&&i!==n-1)return null;
            const isCur=i===curWeekIdx;
            return(
              <text key={i} x={xOf(i)} y={VH-4} textAnchor="middle" fontSize={8}
                fill={isCur?'#60a5fa':'#334155'} fontWeight={isCur?700:400}>W{plan.weeks[i]?.weekNumber||i+1}</text>
            );
          })}
          {/* legend */}
          <line x1={PL+4} y1={VH-PB+8} x2={PL+16} y2={VH-PB+8} stroke="#64748b" strokeWidth={1.5} strokeDasharray="4 2"/>
          <text x={PL+20} y={VH-PB+11} fontSize={9} fill="#64748b">Plan</text>
          <line x1={PL+50} y1={VH-PB+8} x2={PL+62} y2={VH-PB+8} stroke={fillColor} strokeWidth={2}/>
          <text x={PL+66} y={VH-PB+11} fontSize={9} fill="#64748b">Ist</text>
          <rect x={PL+94} y={VH-PB+4} width={10} height={6} fill="#334155" fillOpacity={0.5} rx={1}/>
          <text x={PL+108} y={VH-PB+11} fontSize={9} fill="#64748b">±10% Korridor</text>
          <text x={PL-4} y={PT+8} textAnchor="end" fontSize={9} fill="#475569">km</text>
        </svg>
      </div>
    );
  }

  // ── Trainer: Plan view ────────────────────────────────────────────────────
  function TrainerPlanView({plan,logs,plans,activePlanId,onSelectPlan,onLog,onDeletePlan}){
    const [expandedWeek,setExpandedWeek]=useState(null);
    const today=localISO(new Date());
    const daysLeft=Math.max(0,Math.round((new Date(plan.goal.targetDate)-new Date())/86400000));
    const weeksLeft=Math.ceil(daysLeft/7);
    const allSess=plan.weeks.flatMap(w=>w.sessions);
    const active=allSess.filter(s=>s.type!=='rest');
    const done=active.filter(s=>logs[s.id]&&!logs[s.id].skipped);
    const totalKm=done.reduce((a,s)=>a+(parseFloat(logs[s.id]?.distanceKm)||0),0);
    const pct=Math.round(done.length/Math.max(1,active.length)*100);
    const curWeekIdx=plan.weeks.findIndex(w=>{const d0=w.sessions[0]?.date,d6=w.sessions[6]?.date;return today>=d0&&today<=d6;});
    useEffect(()=>{
      if(expandedWeek===null){
        if(curWeekIdx>=0){setExpandedWeek(curWeekIdx);return;}
        const lastLogged=plan.weeks.reduce((best,w,i)=>{
          return w.sessions.some(s=>logs[s.id])?i:best;
        },-1);
        if(lastLogged>=0)setExpandedWeek(lastLogged);
      }
    },[curWeekIdx]);
    const raceHrs=plan.goal.distanceKm/plan.goal.targetSpeedKmh;
    return(
      <div>
        {/* Plan selector bar */}
        {plans&&plans.length>0&&(
          <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
            {plans.map(p=>(
              <button key={p.id}
                className={`btn-sm ${p.id===activePlanId?'hi':''}`}
                onClick={()=>onSelectPlan(p.id)}
                style={{fontSize:11}}>
                🏆 {p.plan.goal.eventName||'Plan'} · {new Date(p.plan.goal.targetDate).toLocaleDateString('de',{month:'short',year:'2-digit'})}
              </button>
            ))}
            <button className="btn-sm" style={{marginLeft:'auto',fontSize:11}} onClick={()=>onSelectPlan(null)}>+ Neuer Plan</button>
          </div>
        )}

        {/* Goal/progress header */}
        <div className="trainer-progress">
          {/* Title + meta */}
          <div className="trainer-goal-row">
            <div style={{flex:1}}>
              <div className="trainer-goal-label">🏆 {plan.goal.eventName||'Trainingsplan'}</div>
              <div className="trainer-goal-meta">
                <span>📅 {new Date(plan.goal.targetDate).toLocaleDateString('de',{day:'2-digit',month:'long',year:'numeric'})}</span>
                <span>·</span><span>📏 {plan.goal.distanceKm} km</span>
                <span>·</span><span>⚡ {plan.goal.targetSpeedKmh} km/h</span>
                <span>·</span><span>⏱️ {Math.floor(raceHrs)}h{Math.round((raceHrs%1)*60)}min</span>
              </div>
            </div>
            <button className="btn-danger" style={{flexShrink:0}} onClick={onDeletePlan}>🗑️</button>
          </div>

          {/* Charts row: donut + progress curve */}
          <div className="trainer-charts-row">
            {/* Donut */}
            {(()=>{
              const R=52,r=36,cx=60,cy=60,circumference=2*Math.PI*r;
              const stroke=circumference*(1-pct/100);
              const clr=pct>=80?'#22c55e':pct>=40?'#3b82f6':'#f59e0b';
              return(
                <svg width={120} height={120} viewBox="0 0 120 120">
                  <circle cx={cx} cy={cy} r={r} fill="none" stroke="#1a2942" strokeWidth={16}/>
                  <circle cx={cx} cy={cy} r={r} fill="none" stroke={clr} strokeWidth={16}
                    strokeDasharray={circumference} strokeDashoffset={stroke}
                    strokeLinecap="round" transform={`rotate(-90 ${cx} ${cy})`}
                    style={{transition:'stroke-dashoffset 0.8s ease'}}/>
                  <text x={cx} y={cy-6} textAnchor="middle" fontSize={20} fontWeight={700} fill="#f8fafc">{pct}%</text>
                  <text x={cx} y={cy+10} textAnchor="middle" fontSize={9} fill="#64748b">ERLEDIGT</text>
                  <text x={cx} y={cy+22} textAnchor="middle" fontSize={9} fill="#475569">{done.length}/{active.length}</text>
                </svg>
              );
            })()}

            {/* Progress curve */}
            <ProgressCurveChart plan={plan} logs={logs}/>
          </div>

          {/* Phase legend (simplified — phase bar is now embedded in chart) */}
          {(()=>{
            const phases=[];let cur=null;
            plan.weeks.forEach((w,i)=>{
              if(!cur||cur.phase!==w.phase){if(cur)phases.push(cur);cur={phase:w.phase,start:i,count:1,label:w.phaseName};}
              else cur.count++;
            });
            if(cur)phases.push(cur);
            return(
              <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
                {phases.map((ph,i)=>{
                  const meta=PHASE_META[ph.phase];
                  const isCur=ph.start<=curWeekIdx&&curWeekIdx<ph.start+ph.count;
                  return(
                    <span key={i} style={{fontSize:10,color:isCur?meta.color:'#475569',fontWeight:isCur?600:400}}>
                      <span style={{display:'inline-block',width:6,height:6,borderRadius:2,background:meta.color,marginRight:3,verticalAlign:'middle',opacity:isCur?1:0.5}}/>
                      {ph.label} ({ph.count}W)
                    </span>
                  );
                })}
              </div>
            );
          })()}

          {/* Stat chips */}
          <div className="trainer-stat-row">
            {[
              {v:weeksLeft, l:'Wochen noch', clr:weeksLeft<=2?'#ef4444':weeksLeft<=6?'#f59e0b':'#3b82f6'},
              {v:`${pct}%`,  l:'Abgeschlossen', clr:pct>=80?'#22c55e':pct>=40?'#3b82f6':'#f59e0b'},
              {v:done.length, l:'Einheiten ok', clr:'#22c55e'},
              {v:`${Math.round(totalKm)} km`, l:'Gefahren', clr:'#6366f1'},
            ].map(({v,l,clr})=>(
              <div key={l} className="trainer-stat">
                <div className="trainer-stat-val" style={{color:clr}}>{v}</div>
                <div className="trainer-stat-lbl">{l}</div>
              </div>
            ))}
          </div>

          <div style={{marginTop:10,fontSize:11,color:'#334155'}}>
            {plan.profile.fitnessLevel} · {plan.profile.age ? `${plan.profile.age} J.` : ''} {plan.profile.weight ? `· ${plan.profile.weight} kg` : ''}
          </div>
        </div>

        {/* Weeks */}
        {plan.weeks.map((week,wi)=>{
          const isOpen=expandedWeek===wi;
          const isCur=wi===curWeekIdx;
          const ph=PHASE_META[week.phase];
          const wActive=week.sessions.filter(s=>s.type!=='rest');
          const wDone=wActive.filter(s=>logs[s.id]&&!logs[s.id].skipped);
          const wFull=wActive.length>0&&wDone.length===wActive.length;
          return(
            <div key={wi} className="week-row" style={isCur?{borderColor:'#3b82f6',boxShadow:'0 0 0 1px rgba(59,130,246,0.15)'}:{}}>
              <div className="week-header" onClick={()=>setExpandedWeek(isOpen?-1:wi)}>
                <span style={{fontSize:11,fontWeight:700,color:'#64748b',minWidth:28}}>W{week.weekNumber}</span>
                <span className="week-phase-badge" style={{background:`${ph.color}20`,color:ph.color}}>{week.phaseName}</span>
                {isCur&&<span style={{fontSize:10,background:'rgba(59,130,246,0.18)',color:'#60a5fa',padding:'2px 7px',borderRadius:10,fontWeight:600}}>▶ Diese Woche</span>}
                <span style={{flex:1}}/>
                <span style={{fontSize:11,color:'#64748b'}}>{week.dateRange} · {week.weekHrs}h · {week.weekKm}km</span>
                {wFull&&<span style={{fontSize:13,marginLeft:6}}>✅</span>}
                {!wFull&&wDone.length>0&&<span style={{fontSize:11,color:'#60a5fa',marginLeft:6}}>{wDone.length}/{wActive.length}</span>}
                <span style={{color:'#64748b',fontSize:12,marginLeft:6}}>{isOpen?'▲':'▼'}</span>
              </div>
              {isOpen&&(
                <div style={{padding:'8px 10px 12px'}}>
                  {/* Row 1: Plan tiles — always 7 */}
                  <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4,marginBottom:4}}>
                    {week.sessions.map(sess=>{
                      const m=SESSION_META[sess.type]||SESSION_META.ga1;
                      const lg=logs[sess.id];
                      const isDone=lg&&!lg.skipped;
                      const isSkip=lg?.skipped;
                      return(
                        <div key={sess.id} style={{
                          background:`${m.color}16`,
                          border:`1px solid ${isDone?m.color:isSkip?'#334155':'#1e293b'}`,
                          borderRadius:8,padding:'7px 4px 6px',textAlign:'center',
                          opacity:isSkip?0.38:1,position:'relative',minWidth:0
                        }}>
                          <div style={{fontSize:9,fontWeight:600,color:'#64748b',marginBottom:3,letterSpacing:'0.5px'}}>{sess.dayShort}</div>
                          <div style={{fontSize:22,lineHeight:1}}>{m.emoji}</div>
                          <div style={{fontSize:9,fontWeight:600,color:m.color,marginTop:3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{m.label}</div>
                          {sess.distanceKm>0&&<div style={{fontSize:9,color:'#475569',marginTop:2}}>{sess.distanceKm}km</div>}
                          {sess.durationMin>0&&!sess.distanceKm&&<div style={{fontSize:9,color:'#475569',marginTop:2}}>{sess.durationMin}min</div>}
                          {isDone&&<div style={{position:'absolute',top:3,right:4,fontSize:9,color:'#22c55e'}}>✓</div>}
                          {isSkip&&<div style={{position:'absolute',top:3,right:4,fontSize:9,color:'#ef4444'}}>–</div>}
                        </div>
                      );
                    })}
                  </div>

                  {/* Row 2: Activity tiles — same grid, only shown when log has data */}
                  {week.sessions.some(s=>logs[s.id]&&!logs[s.id].skipped&&(parseFloat(logs[s.id].distanceKm)||parseFloat(logs[s.id].avgHR)))&&(
                    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4}}>
                      {week.sessions.map(sess=>{
                        const lg=logs[sess.id];
                        const hasData=lg&&!lg.skipped&&(parseFloat(lg.distanceKm)||parseFloat(lg.avgHR));
                        if(!hasData)return <div key={sess.id}/>;
                        const planKm=sess.distanceKm;
                        const actKm=parseFloat(lg.distanceKm)||0;
                        const met=planKm>0&&actKm>=planKm*0.9;
                        const clr=met?'#22c55e':'#3b82f6';
                        return(
                          <div key={sess.id} style={{
                            background:`${clr}10`,
                            border:`1px solid ${clr}40`,
                            borderRadius:8,padding:'6px 4px',textAlign:'center',minWidth:0
                          }}>
                            {actKm>0&&<div style={{fontSize:11,fontWeight:700,color:clr,lineHeight:1}}>{actKm}<span style={{fontSize:8,fontWeight:400,color:'#64748b'}}> km</span></div>}
                            {parseFloat(lg.avgSpeed)>0&&<div style={{fontSize:9,color:'#94a3b8',marginTop:2}}>{parseFloat(lg.avgSpeed).toFixed(1)}<span style={{fontSize:8}}> km/h</span></div>}
                            {parseFloat(lg.avgHR)>0&&<div style={{fontSize:9,color:'#f87171',marginTop:1}}>♥ {Math.round(parseFloat(lg.avgHR))}</div>}
                            {parseFloat(lg.elevationM)>0&&<div style={{fontSize:9,color:'#a78bfa',marginTop:1}}>⛰ {Math.round(parseFloat(lg.elevationM))}</div>}
                            {lg.rpe>0&&<div style={{fontSize:9,color:'#f59e0b',marginTop:1}}>RPE {lg.rpe}</div>}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}

      </div>
    );
  }

  // ── Trainer: Panel wrapper ────────────────────────────────────────────────
  function TrainerPanel({plan,logs,plans,activePlanId,onSelectPlan,onCreatePlan,onLogSession,onDeletePlan,profile}){
    if(!plan)return <TrainerSetup onCreate={onCreatePlan} profile={profile}/>;
    return <TrainerPlanView plan={plan} logs={logs} plans={plans} activePlanId={activePlanId}
      onSelectPlan={onSelectPlan} onLog={onLogSession} onDeletePlan={onDeletePlan}/>;
  }

  // ── SVG Charts ───────────────────────────────────────────────────────────
  function PlanActualChart({planWeeks,activities}){
    const weeks=planWeeks.slice(-16);
    const actByWeek=weeks.map(w=>{
      const d0=w.sessions[0]?.date,d6=w.sessions[6]?.date;
      return activities.filter(a=>a.date>=d0&&a.date<=d6&&isRideType(a.type)).reduce((s,a)=>s+a.distanceKm,0);
    });
    const maxKm=Math.max(...weeks.map(w=>w.weekKm),...actByWeek,10);
    const W=600,H=170,PL=36,PT=8,PB=28,PR=8;
    const cW=W-PL-PR,cH=H-PT-PB;
    const bW=Math.max(5,cW/weeks.length*0.38);
    const xC=i=>PL+(i+0.5)*cW/weeks.length;
    return(
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
        {[0,0.25,0.5,0.75,1].map(f=>(
          <line key={f} x1={PL} y1={PT+cH*(1-f)} x2={PL+cW} y2={PT+cH*(1-f)} stroke="#1e293b" strokeWidth={f===0?1.5:1}/>
        ))}
        {[0,0.5,1].map(f=>(
          <text key={f} x={PL-4} y={PT+cH*(1-f)+3.5} textAnchor="end" fontSize={9} fill="#475569">{Math.round(maxKm*f)}</text>
        ))}
        {weeks.map((w,i)=>{
          const planH=(w.weekKm/maxKm)*cH;
          const actH=(actByWeek[i]/maxKm)*cH;
          const achieved=actByWeek[i]>=w.weekKm*0.9;
          const x=xC(i);
          return(
            <g key={i}>
              <rect x={x-bW} y={PT+cH-planH} width={bW} height={planH} fill="#334155" rx={2} opacity={0.8}/>
              <rect x={x} y={PT+cH-Math.max(actH,actByWeek[i]>0?2:0)} width={bW} height={Math.max(actH,actByWeek[i]>0?2:0)} fill={achieved?'#22c55e':'#3b82f6'} rx={2}/>
              {i%2===0&&<text x={x} y={H-8} textAnchor="middle" fontSize={8} fill="#475569">W{w.weekNumber}</text>}
            </g>
          );
        })}
        <rect x={PL+4} y={4} width={10} height={7} fill="#334155" rx={1}/><text x={PL+17} y={10} fontSize={9} fill="#64748b">Plan</text>
        <rect x={PL+50} y={4} width={10} height={7} fill="#3b82f6" rx={1}/><text x={PL+63} y={10} fontSize={9} fill="#64748b">Ist</text>
        <rect x={PL+90} y={4} width={10} height={7} fill="#22c55e" rx={1}/><text x={PL+103} y={10} fontSize={9} fill="#64748b">Ziel ≥90%</text>
        <text x={PL-4} y={10} textAnchor="end" fontSize={9} fill="#475569">km</text>
      </svg>
    );
  }

  function TrendChart({activities,metric,color}){
    const pts=activities.filter(a=>a[metric]!=null&&isRideType(a.type)).sort((a,b)=>a.date.localeCompare(b.date)).slice(-60).map(a=>({x:a.date,y:+a[metric]}));
    if(pts.length<2)return<div style={{color:'#475569',fontSize:12,textAlign:'center',padding:24}}>Nicht genug Daten für den gewählten Zeitraum.</div>;
    const W=600,H=130,PL=38,PT=8,PB=22,PR=8;
    const cW=W-PL-PR,cH=H-PT-PB;
    const ys=pts.map(p=>p.y),minY=Math.min(...ys),maxY=Math.max(...ys),rng=maxY-minY||1;
    const xi=i=>PL+(i/(pts.length-1))*cW;
    const yv=y=>PT+(1-(y-minY)/rng)*cH;
    // 5-point moving average
    const ma=pts.map((_,i)=>{const w=pts.slice(Math.max(0,i-2),i+3);return w.reduce((s,p)=>s+p.y,0)/w.length;});
    const maPts=ma.map((y,i)=>`${xi(i).toFixed(1)},${yv(y).toFixed(1)}`).join(' ');
    const unit=({avgSpeedKmh:'km/h',distanceKm:'km',avgHR:'bpm',avgWatts:'W',elevationGainM:'m'})[metric]||'';
    return(
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
        {[0,0.5,1].map(f=>(
          <React.Fragment key={f}>
            <line x1={PL} y1={PT+cH*(1-f)} x2={PL+cW} y2={PT+cH*(1-f)} stroke="#1e293b" strokeWidth="1"/>
            <text x={PL-3} y={PT+cH*(1-f)+3.5} textAnchor="end" fontSize={9} fill="#475569">{Math.round(minY+rng*f)}{unit}</text>
          </React.Fragment>
        ))}
        {pts.map((p,i)=><circle key={i} cx={xi(i)} cy={yv(p.y)} r={3} fill={color} opacity={0.45}/>)}
        <polyline points={maPts} fill="none" stroke={color} strokeWidth={2.2} strokeLinejoin="round"/>
        {[0,Math.floor(pts.length/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>(
          <text key={i} x={xi(i)} y={H-4} textAnchor="middle" fontSize={9} fill="#475569">{pts[i].x.slice(5)}</text>
        ))}
      </svg>
    );
  }

  // ── Import section ────────────────────────────────────────────────────────
  function ImportSection({onAdd}){
    const [msg,setMsg]=useState('');
    const [err,setErr]=useState('');
    const fileRef=useRef(null);
    const process=async files=>{
      let added=0,errs=0;
      for(const file of files){
        const text=await file.text();
        if(file.name.toLowerCase().endsWith('.csv')){
          const acts=parseStravaCsv(text);
          if(acts.length){onAdd(acts);added+=acts.length;}
          else errs++;
        }else if(file.name.toLowerCase().endsWith('.gpx')){
          const act=parseGpxFile(text);
          if(act){onAdd([act]);added++;}
          else errs++;
        }else errs++;
      }
      if(added>0)setMsg(`✅ ${added} Aktivität${added!==1?'en':''} importiert.`);
      if(errs>0)setErr(`⚠️ ${errs} Datei${errs!==1?'en':''} konnten nicht gelesen werden.`);
      setTimeout(()=>{setMsg('');setErr('');},4000);
    };
    const onDrop=e=>{e.preventDefault();e.currentTarget.classList.remove('over');process(Array.from(e.dataTransfer.files));};
    return(
      <div className="import-box">
        <div style={{fontSize:13,fontWeight:600,color:'#f8fafc',marginBottom:8}}>📥 Aktivitäten importieren</div>
        <div style={{fontSize:11,color:'#64748b',marginBottom:10,lineHeight:1.6}}>

  // ── Auto-link helper ─────────────────────────────────────────────────────
  function linkActivityToSession(activity, plan) {
    if (!plan) return null;
    for (const week of plan.weeks) {
      for (const sess of week.sessions) {
        if (sess.date === activity.date) return { sess, week };
      }
    }
    return null;
  }

  // ── App ───────────────────────────────────────────────────────────────────
  function App(){
    // Load saved state once on startup
    const _saved=React.useMemo(()=>{
      try{return JSON.parse(localStorage.getItem('rennrad-v1'))||{};}catch{return{};}
    },[]);

    // shared
    const [apiKey,setApiKey]=useState(_saved.apiKey||'');
    const [planMode,setPlanMode]=useState('roundtrip'); // 'roundtrip'|'manual'
    const [profile,setProfile]=useState(_saved.profile||{name:'Fahrer',speed:25,age:'',weight:'',fitnessLevel:'intermediate',weeklyKm:'',ftp:''});
    const [savedTours,setSavedTours]=useState(_saved.savedTours||[]);
    const [activeTab,setActiveTab]=useState('routes');

    // round-trip
    const [startCoord,setStartCoord]=useState(null);
    const [startLabel,setStartLabel]=useState('');
    const [distKm,setDistKm]=useState(80);
    const [surfaces,setSurfaces]=useState(['asphalt']);
    const [rtLoading,setRtLoading]=useState(false);
    const [rtError,setRtError]=useState('');
    const [rtRoutes,setRtRoutes]=useState([]);

    // manual
    const [manWaypoints,setManWaypoints]=useState([]); // [{coord,name}]
    const [manPref,setManPref]=useState('recommended');
    const [manLoop,setManLoop]=useState(false);
    const [manRoute,setManRoute]=useState(null);
    const [manLoading,setManLoading]=useState(false);
    const [manError,setManError]=useState('');

    // trainer — multiple plans
    const [trainingPlans,setTrainingPlans]=useState(_saved.trainingPlans||[]);
    const [activePlanId,setActivePlanId]=useState(_saved.activePlanId||null);
    const [activities,setActivities]=useState(_saved.activities||[]);
    const manWpRef=useRef([]);
    const manReqId=useRef(0);

    // Persist to localStorage on every relevant change
    useEffect(()=>{
      try{
        localStorage.setItem('rennrad-v1',JSON.stringify({apiKey,profile,savedTours,trainingPlans,activePlanId,activities}));
      }catch{}
    },[apiKey,profile,savedTours,trainingPlans,activePlanId,activities]);

    // ── Round-trip planning ──
    const planRoundTrips=async()=>{
      if(!apiKey.trim()){setRtError('Bitte trage deinen API-Key ein.');return;}
      if(!startCoord){setRtError('Bitte wähle einen gültigen Startpunkt.');return;}
      setRtLoading(true);setRtError('');setRtRoutes([]);
      try{
        const results=await Promise.all(ROUTE_TYPES.map(async t=>{
          const feat=await fetchRoundTrip(apiKey,startCoord,distKm,t.pref,t.seed);
          return parseFeature(feat,t.id);
        }));
        setRtRoutes(results);setActiveTab('routes');
      }catch(e){setRtError(e.message||'Fehler bei der Routenplanung.');}
      finally{setRtLoading(false);}
    };

    // ── Manual route auto-recalc ──
    const recalcManual=useCallback(async(wps,pref,loop)=>{
      if(!apiKey.trim()||wps.length<2){setManRoute(null);return;}
      const id=++manReqId.current;setManLoading(true);setManError('');
      try{
        const coords=wps.map(w=>w.coord);
        const waypoints=loop?[...coords,coords[0]]:coords;
        const feat=await fetchViaRoute(apiKey,waypoints,pref);
        if(id!==manReqId.current)return;
        setManRoute(parseFeature(feat,'manual'));
      }catch(e){if(id===manReqId.current)setManError(e.message);}
      finally{if(id===manReqId.current)setManLoading(false);}
    },[apiKey]);

    const updateManWaypoints=useCallback(nv=>{
      manWpRef.current=nv;setManWaypoints(nv);recalcManual(nv,manPref,manLoop);
    },[recalcManual,manPref,manLoop]);

    // Re-calc when pref/loop changes
    useEffect(()=>{if(manWpRef.current.length>=2)recalcManual(manWpRef.current,manPref,manLoop);},[manPref,manLoop,recalcManual]);

    const addManWp=useCallback(async(coord,nameOvr)=>{
      const name=nameOvr||await reverseGeocode(coord[0],coord[1]);
      updateManWaypoints([...manWpRef.current,{coord,name}]);
    },[updateManWaypoints]);
    const removeManWp=useCallback(i=>updateManWaypoints(manWpRef.current.filter((_,j)=>j!==i)),[updateManWaypoints]);
    const reorderManWp=useCallback((from,to)=>{
      if(to<0||to>=manWpRef.current.length)return;
      const nv=[...manWpRef.current];[nv[from],nv[to]]=[nv[to],nv[from]];updateManWaypoints(nv);
    },[updateManWaypoints]);
    const moveManWp=useCallback(async(i,coord)=>{
      const nv=[...manWpRef.current];
      nv[i]={...nv[i],coord};
      manWpRef.current=nv;setManWaypoints([...nv]);
      recalcManual(nv,manPref,manLoop);
      const name=await reverseGeocode(coord[0],coord[1]);
      const l=[...manWpRef.current];
      if(l[i]){l[i]={...l[i],name};manWpRef.current=l;setManWaypoints([...l]);}
    },[recalcManual,manPref,manLoop]);

    // ── Trainer callbacks ──
    const createTrainingPlan=useCallback((prof,goal)=>{
      const newPlan=generateTrainingPlan(prof,goal);
      const entry={id:String(Date.now()),plan:newPlan,logs:{}};
      setTrainingPlans(prev=>[...prev,entry]);
      setActivePlanId(entry.id);
      setActiveTab('trainer');
    },[]);
    const logTrainingSession=useCallback((sessId,log)=>{
      setTrainingPlans(prev=>prev.map(p=>
        p.id===activePlanId
          ?{...p,logs:log===undefined?(({[sessId]:_,...rest})=>rest)(p.logs):{...p.logs,[sessId]:log}}
          :p
      ));
    },[activePlanId]);
    const deleteTrainingPlan=useCallback(()=>{
      setTrainingPlans(prev=>{
        const next=prev.filter(p=>p.id!==activePlanId);
        setActivePlanId(next.length>0?next[next.length-1].id:null);
        return next;
      });
    },[activePlanId]);

    // ── Backup ──
    const exportBackup=useCallback(()=>{
      const data={version:2,exportedAt:new Date().toISOString(),apiKey,profile,savedTours,trainingPlans,activePlanId,activities};
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=`rennrad-backup-${localISO(new Date())}.json`;a.click();
      URL.revokeObjectURL(url);
    },[apiKey,profile,savedTours,trainingPlans,activePlanId,activities]);
    const importBackup=useCallback((data)=>{
      if(!data||(data.version!==1&&data.version!==2)){alert('Unbekanntes Backup-Format.');return;}
      if(data.apiKey!==undefined)setApiKey(data.apiKey);
      if(data.profile)setProfile(p=>({...p,...data.profile}));
      if(data.savedTours)setSavedTours(data.savedTours);
      // v2: trainingPlans array
      if(data.trainingPlans){
        setTrainingPlans(data.trainingPlans);
        setActivePlanId(data.activePlanId||null);
      }else if(data.trainingPlan){
        // migrate v1 backup: wrap single plan in array
        const entry={id:String(Date.now()),plan:data.trainingPlan,logs:data.trainingLogs||{}};
        setTrainingPlans([entry]);
        setActivePlanId(entry.id);
      }
      if(data.activities)setActivities(data.activities);
    },[]);

    return(
      <>
        {/* ── SIDEBAR ── */}
        <aside className="sidebar">
          <div className="sidebar-header">
            <div className="app-title"><span style={{fontSize:26}}>🚴</span><div><div>Rennrad Planer</div><div className="app-subtitle">Routen für jeden Anspruch</div></div></div>
          </div>

          {/* Mode selector */}
          <div className="sidebar-section">
            <div className="mode-tabs">
              <button className={`mode-tab ${planMode==='roundtrip'?'active':''}`} onClick={()=>setPlanMode('roundtrip')}>🔄 Rundtour</button>
              <button className={`mode-tab ${planMode==='manual'?'active':''}`} onClick={()=>setPlanMode('manual')}>📍 Manuell</button>
            </div>
          </div>

          {/* API Key */}
          <div className="sidebar-section">
            <div className="section-title">🔑 API-Zugang</div>
            <div className="api-key-notice">Key bei <a href="https://openrouteservice.org" target="_blank" rel="noreferrer">openrouteservice.org</a> — 2.000/Tag gratis.</div>
            <input type="text" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="5b3ce3…"/>
          </div>

          {/* ── RUNDTOUR mode ── */}
          {planMode==='roundtrip'&&(
            <>
              <div className="sidebar-section">
                <div className="section-title">📍 Startpunkt & Distanz</div>
                <div className="form-group">
                  <label>Startpunkt</label>
                  <GeoSearch mode="confirm" placeholder="Ort, Adresse oder Koordinaten" onSelect={(coord,label)=>{setStartCoord(coord);setStartLabel(label||'');}} onClear={()=>{setStartCoord(null);setStartLabel('');}}/>
                </div>
                <div className="form-group">
                  <label>Streckenlänge</label>
                  <input type="range" min="20" max="250" step="5" value={distKm} onChange={e=>setDistKm(+e.target.value)}/>
                  <div className="range-display"><span className="range-value">{distKm}</span><span className="range-unit">km</span></div>
                </div>
              </div>
              <div className="sidebar-section">
                <div className="section-title">🛤️ Belagsarten</div>
                <div className="surface-grid">
                  {SURFACE_OPTIONS.map(s=>(
                    <label key={s.id} className={`surface-chip ${surfaces.includes(s.id)?'active':''}`}>
                      <input type="checkbox" checked={surfaces.includes(s.id)} onChange={()=>setSurfaces(p=>p.includes(s.id)?p.filter(x=>x!==s.id):[...p,s.id])} style={{display:'none'}}/>
                      <span>{s.icon}</span><span>{s.label}</span>
                    </label>
                  ))}
                </div>
              </div>
              <div className="sidebar-section">
                <div className="section-title">⚡ Geschwindigkeit</div>
                <label>Ø <strong style={{color:'#3b82f6'}}>{profile.speed} km/h</strong></label>
                <input type="range" min="10" max="45" step="1" value={profile.speed} onChange={e=>setProfile(p=>({...p,speed:+e.target.value}))}/>
              </div>
              <div className="sidebar-section">
                <button className="btn-primary" onClick={planRoundTrips} disabled={rtLoading}>
                  {rtLoading?<><span className="spin-inline"/> Plane Routen…</>:<><span>🔄</span> 3 Rundtouren planen</>}
                </button>
              </div>
            </>
          )}

          {/* ── MANUAL mode ── */}
          {planMode==='manual'&&(
            <>
              <div className="sidebar-section" style={{flex:1}}>
                <div className="section-title">📍 Wegpunkte</div>
                <div className="mwp-list">
                  {manWaypoints.length===0&&<div className="mwp-empty">Noch keine Wegpunkte.<br/>Füge Orte in der gewünschten Reihenfolge hinzu.</div>}
                  {manWaypoints.map((wp,i)=>{
                    const isFirst=i===0,isLast=i===manWaypoints.length-1&&manWaypoints.length>1;
                    return(
                      <div key={i} className="mwp-row">
                        <span className={`mwp-badge ${isFirst?'first':isLast&&!manLoop?'last':''}`} style={(!isFirst&&!(isLast&&!manLoop))?{background:'#6366f1'}:{}}>
                          {isFirst?'🟢':isLast&&!manLoop?'🔴':i+1}
                        </span>
                        <span className="mwp-name" title={wp.name}>{wp.name}</span>
                        <div className="mwp-actions">
                          <button className="mwp-btn" onClick={()=>reorderManWp(i,i-1)} disabled={i===0}>↑</button>
                          <button className="mwp-btn" onClick={()=>reorderManWp(i,i+1)} disabled={i===manWaypoints.length-1}>↓</button>
                          <button className="mwp-btn del" onClick={()=>removeManWp(i)}>✕</button>
                        </div>
                      </div>
                    );
                  })}
                  {manLoop&&manWaypoints.length>0&&(
                    <div className="mwp-row" style={{opacity:0.5}}>
                      <span className="mwp-badge last">🔴</span>
                      <span className="mwp-name" style={{color:'#86efac'}}>{manWaypoints[0].name} (Ziel)</span>
                    </div>
                  )}
                </div>
                <div style={{marginTop:10}}>
                  <GeoSearch mode="oneshot" placeholder="➕ Ort suchen oder Koordinaten…" onSelect={addManWp}/>
                </div>
              </div>

              <div className="sidebar-section">
                <div className="section-title">🔀 Routenpräferenz</div>
                <div className="pref-row">
                  {PREFS.map(p=>(
                    <button key={p.id} className={`pref-btn ${manPref===p.id?'active':''}`} onClick={()=>setManPref(p.id)}>{p.label}</button>
                  ))}
                </div>
              </div>

              <div className="sidebar-section">
                <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13,color:'#94a3b8'}}>
                  <input type="checkbox" checked={manLoop} onChange={e=>setManLoop(e.target.checked)} style={{accentColor:'#6366f1',width:14,height:14}}/>
                  Rundtour (zurück zum Startpunkt)
                </label>
              </div>

              <div className="sidebar-section">
                <div className="section-title">⚡ Geschwindigkeit</div>
                <label>Ø <strong style={{color:'#3b82f6'}}>{profile.speed} km/h</strong></label>
                <input type="range" min="10" max="45" step="1" value={profile.speed} onChange={e=>setProfile(p=>({...p,speed:+e.target.value}))}/>
              </div>
            </>
          )}
        </aside>

        {/* ── MAIN ── */}
        <main className="main">
          <div className="tabs">
            <button className={`tab ${activeTab==='routes'?'active':''}`} onClick={()=>setActiveTab('routes')}>🗺️ Routen{planMode==='roundtrip'&&rtRoutes.length>0?` (${rtRoutes.length})`:planMode==='manual'&&manRoute?' (1)':''}</button>
            <button className={`tab ${activeTab==='saved'?'active':''}`} onClick={()=>setActiveTab('saved')}>💾 Gespeichert{savedTours.length>0?` (${savedTours.length})`:''}</button>
            <button className={`tab ${activeTab==='trainer'?'active':''}`} onClick={()=>setActiveTab('trainer')}>🏋️ Trainer{trainingPlans.length>0?` (${trainingPlans.length})`:''}</button>
            <button className={`tab ${activeTab==='analytics'?'active':''}`} onClick={()=>setActiveTab('analytics')}>📊 Auswertung</button>
            <button className={`tab ${activeTab==='activities'?'active':''}`} onClick={()=>setActiveTab('activities')}>🚴 Aktivitäten{activities.length>0?` (${activities.length})`:''}</button>
            <button className={`tab ${activeTab==='profile'?'active':''}`} onClick={()=>setActiveTab('profile')}>👤 Profil</button>
          </div>

          {activeTab==='routes'&&(
            <>
              {/* Roundtrip mode */}
              {planMode==='roundtrip'&&(
                <>
                  {rtError&&<div className="error-box"><span style={{fontSize:19,flexShrink:0}}>⚠️</span><div><strong>Fehler:</strong> {rtError}</div></div>}
                  {rtLoading&&<div className="spinner-overlay"><div className="spinner"/><div>Berechne 3 Rundtouren…</div></div>}
                  {!rtLoading&&rtRoutes.length===0&&(
                    <div className="empty-state"><div className="empty-icon">🔄</div><div className="empty-title">Bereit für deine Rundtour?</div><div className="empty-text">Wähle links Startpunkt und Distanz, dann „3 Rundtouren planen".</div></div>
                  )}
                  {!rtLoading&&rtRoutes.length>0&&(
                    <div className="routes-grid">
                      {rtRoutes.map((r,i)=>(
                        <RouteCard key={i} index={i} initialRoute={r} apiKey={apiKey} startLabel={startLabel}
                          typeInfo={ROUTE_TYPES.find(t=>t.id===r.type)} speedKmh={profile.speed}
                          onSave={(r,n)=>setSavedTours(p=>[...p,{name:n,route:r}])}/>
                      ))}
                    </div>
                  )}
                </>
              )}

              {/* Manual mode */}
              {planMode==='manual'&&(
                <ManualRouteCard route={manRoute} loading={manLoading} error={manError}
                  speedKmh={profile.speed} waypoints={manWaypoints}
                  onSave={(r,n)=>setSavedTours(p=>[...p,{name:n,route:r}])}
                  onMoveWaypoint={moveManWp}/>
              )}
            </>
          )}

          {activeTab==='saved'&&(
            savedTours.length===0
              ?<div className="empty-state"><div className="empty-icon">🗺️</div><div className="empty-title">Noch keine Touren gespeichert</div><div className="empty-text">Plane eine Route und speichere sie hier.</div></div>
              :<div>{savedTours.map((t,i)=><SavedRouteCard key={i} tour={t} index={i} onDelete={j=>setSavedTours(p=>p.filter((_,k)=>k!==j))}/>)}</div>
          )}

          {activeTab==='trainer'&&(
            <TrainerPanel
              plan={trainingPlans.find(p=>p.id===activePlanId)?.plan||null}
              logs={trainingPlans.find(p=>p.id===activePlanId)?.logs||{}}
              plans={trainingPlans}
              activePlanId={activePlanId}
              onSelectPlan={setActivePlanId}
              profile={profile}
              onCreatePlan={createTrainingPlan}
              onLogSession={logTrainingSession}
              onDeletePlan={deleteTrainingPlan}/>
          )}

          {activeTab==='analytics'&&(
            <div style={{padding:'16px'}}>
              <AnalyticsPanel activities={activities}
                trainingPlan={trainingPlans.find(p=>p.id===activePlanId)?.plan||null}
                trainingLogs={trainingPlans.find(p=>p.id===activePlanId)?.logs||{}}/>
            </div>
          )}

          {activeTab==='activities'&&(
            <div style={{padding:'16px'}}>
              <ActivityTab
                activities={activities}
                trainingPlan={trainingPlans.find(p=>p.id===activePlanId)?.plan||null}
                trainingLogs={trainingPlans.find(p=>p.id===activePlanId)?.logs||{}}
                onAddActivities={newActs=>{
                  setActivities(prev=>{
                    const ids=new Set(prev.map(a=>a.id));
                    return [...prev,...newActs.filter(a=>!ids.has(a.id))].sort((a,b)=>b.date.localeCompare(a.date));
                  });
                  // Auto-link to active training plan
                  const activePlan=trainingPlans.find(p=>p.id===activePlanId);
                  if(activePlan){
                    newActs.forEach(act=>{
                      const result=linkActivityToSession(act,activePlan.plan);
                      if(result&&!activePlan.logs[result.sess.id]){
                        logTrainingSession(result.sess.id,{
                          distanceKm:act.distanceKm,
                          avgSpeed:act.avgSpeedKmh,
                          avgHR:act.avgHR,
                          maxHR:act.maxHR,
                          elevationM:act.elevationGainM,
                          rpe:0,
                          notes:`Auto: ${act.name}`,
                          skipped:false,
                          linkedActivityId:act.id,
                        });
                      }
                    });
                  }
                }}
                onDeleteActivity={id=>setActivities(prev=>prev.filter(a=>a.id!==id))}
                onUpdateTrainingLog={logTrainingSession}
              />
            </div>
          )}

          {activeTab==='profile'&&<ProfilePanel profile={profile} onChange={setProfile} onExport={exportBackup} onImport={importBackup}/>}
        </main>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
